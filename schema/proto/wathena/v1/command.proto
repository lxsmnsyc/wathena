syntax = "proto3";

package wathena.v1;

option go_package = "github.com/lxsmnsyc/wathena/schema/gen/go/wathena/v1;wathenav1";

// Command is a player action. The server checks every command against its
// own state before it runs (strategy section 4.1, item 9).
message Command {
  oneof body {
    WalkTo walk_to = 1;
    Attack attack = 2;
    UseSkill use_skill = 3;
    Chat chat = 4;
    NpcClick npc_click = 5;
    NpcReply npc_reply = 6;
    UseItem use_item = 7;
    PickUp pick_up = 8;
    RaiseStat raise_stat = 9;
    DropItem drop_item = 10;
    ShopBuy shop_buy = 11;
    ShopSell shop_sell = 12;
    ShopClose shop_close = 13;
    EquipItem equip_item = 14;
    UnequipItem unequip_item = 15;
    InsertCard insert_card = 16;
    LearnSkill learn_skill = 17;
    ChannelCommand channel = 18;
    Block block = 19;
    Report report = 20;
    PartyCommand party = 21;
    FriendCommand friend = 22;
    PartyBookingCommand party_booking = 23;
    GuildCommand guild = 24;
    StorageCommand storage = 25;
    TradeCommand trade = 26;
    MailCommand mail = 27;
    VendingCommand vending = 28;
    BuyingStoreCommand buying_store = 29;
    StoreSearchCommand store_search = 30;
  }
}

message WalkTo {
  uint32 x = 1;
  uint32 y = 2;
}

message Attack {
  uint32 target = 1;
  // repeat keeps attacking until the target dies or leaves range.
  bool repeat = 2;
}

// UseSkill casts a skill the player knows, at a level up to the one it
// learned, as clif_parse_UseSkillToId and clif_parse_UseSkillToPos.
message UseSkill {
  uint32 skill_id = 1;
  uint32 level = 2;
  // A skill targets an entity or a cell. Leave both empty for self skills.
  oneof target {
    uint32 entity = 3;
    Cell cell = 4;
  }
}

// LearnSkill spends a skill point on a skill of the player's skill list,
// as pc_skillup.
message LearnSkill {
  uint32 skill_id = 1;
}

message Cell {
  uint32 x = 1;
  uint32 y = 2;
}

// Chat says a line. The server checks the sender's mute, the chat filter
// and the rate limits first. A line it refuses comes back as ChatRefused.
message Chat {
  ChatChannel channel = 1;
  string text = 2;
  // to is a character name for whispers. The server answers a whisper
  // with WhisperResult. A name that starts with # whispers to that chat
  // channel, as rAthena does, and joins it first when anyone may join.
  string to = 3;
  // channel_name is the channel's name with its #, such as #trade, for
  // CHAT_CHANNEL_NAMED.
  string channel_name = 4;
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_LOCAL = 1;
  CHAT_CHANNEL_PARTY = 2;
  CHAT_CHANNEL_GUILD = 3;
  CHAT_CHANNEL_WHISPER = 4;
  CHAT_CHANNEL_WORLD = 5;
  // SYSTEM is text from the server to one player, such as a mod
  // script's player:send_message. from is 0 and from_name is empty.
  // Clients never send it.
  CHAT_CHANNEL_SYSTEM = 6;
  // ANNOUNCEMENT is a broadcast to every player of a map or of the
  // world, as rAthena's announce and mapannounce. from is 0 and
  // from_name is empty. Clients never send it.
  CHAT_CHANNEL_ANNOUNCEMENT = 7;
  // NAMED is a chat channel such as #global or #trade, as rAthena's
  // channel system. ChatMessage.channel_name names it.
  CHAT_CHANNEL_NAMED = 8;
}

// ChannelCommand joins or leaves a chat channel, or asks for the list of
// channels or the members of one, as rAthena's @join and @channel.
message ChannelCommand {
  ChannelAction action = 1;
  // name is the channel's name with its #, such as #trade. LIST does not
  // use it.
  string name = 2;
}

enum ChannelAction {
  CHANNEL_ACTION_UNSPECIFIED = 0;
  // JOIN joins a channel that anyone may join. The server answers with
  // ChannelJoined or ChannelFailed.
  CHANNEL_ACTION_JOIN = 1;
  // LEAVE leaves a channel the player may leave. The server answers with
  // ChannelLeft or ChannelFailed.
  CHANNEL_ACTION_LEAVE = 2;
  // LIST asks for the channels the player may join, with ChannelList.
  CHANNEL_ACTION_LIST = 3;
  // MEMBERS asks for the members of a channel the player is in, with
  // ChannelMembers.
  CHANNEL_ACTION_MEMBERS = 4;
}

// Block adds a character name to the player's block list, or removes
// one, as rAthena's /ex and /in. A blocked player cannot whisper to the
// player, and the player does not see its chat. The server answers with
// BlockList.
message Block {
  // name is a character name, 1 to 24 characters.
  string name = 1;
  bool unblock = 2;
}

// Report reports a player, or one chat line, to the staff (strategy
// section 7.10). The report keeps the chat the player saw in the last 5
// minutes. The server answers with ReportResult.
message Report {
  // name is the reported character's name. It is empty for a report of
  // a guild.
  string name = 1;
  // line_id is ChatMessage.line_id of the reported line, or empty to
  // report the player.
  bytes line_id = 2;
  // reason is the player's own words, at most 255 characters.
  string reason = 3;
  // guild_id reports a guild's name, or its emblem with emblem set, in
  // place of a player (strategy section 7.10).
  uint64 guild_id = 4;
  bool emblem = 5;
}

// NpcClick talks to an NPC, or opens its shop, as rAthena's npc_click.
// The NPC must be within 15 cells on both axes.
message NpcClick {
  uint32 npc = 1;
}

// NpcReply answers the open NPC dialog step.
message NpcReply {
  // dialog is NpcDialog.dialog from the step being answered.
  uint32 dialog = 1;
  oneof answer {
    // next answers a next prompt.
    bool next = 2;
    // menu is the chosen option of a menu prompt, from 1.
    uint32 menu = 3;
    // input_text answers an input_text prompt: at most text_max
    // characters, cleaned as chat is.
    string input_text = 4;
    // input_number answers an input_number prompt, from number_min to
    // number_max.
    int64 input_number = 5;
    // close answers a close prompt, or cancels a menu or an input. It
    // ends the conversation.
    bool close = 6;
  }
}

// ShopBuy buys items from the shop that ShopOpen showed, in one step,
// as rAthena's npc_buylist. The server answers with ShopResult.
message ShopBuy {
  // npc is ShopOpen.npc.
  uint32 npc = 1;
  // items are 1 to 100 lines. Each item must be in the shop.
  repeated ShopBuyLine items = 2;
}

message ShopBuyLine {
  uint32 item_id = 1;
  // amount is 1 to 30000. Items that do not stack are bought one at a
  // time, so their amount is 1.
  uint32 amount = 2;
}

// ShopSell sells inventory slots to the shop that ShopOpen showed, as
// rAthena's npc_selllist. The server answers with ShopResult.
message ShopSell {
  uint32 npc = 1;
  // items are 1 to 100 lines, each slot at most once.
  repeated ShopSellLine items = 2;
}

message ShopSellLine {
  // slot is an inventory slot, below 200.
  uint32 slot = 1;
  // amount is 1 to 30000, and at most the slot's amount.
  uint32 amount = 2;
}

// ShopClose closes the shop window without buying or selling.
message ShopClose {
  uint32 npc = 1;
}

// UseItem uses the item in an inventory slot, as rAthena's pc_useitem.
// The server answers with ItemUsed and InventoryRemove, or UseItemFailed.
message UseItem {
  // slot is an inventory slot from InventoryUpdate or InventoryAdd, below
  // 200.
  uint32 slot = 1;
}

// DropItem drops an amount from an inventory slot on the ground near the
// player, as rAthena's pc_dropitem. The server answers with
// InventoryRemove, or DropItemFailed.
message DropItem {
  // slot is below 200, as in UseItem.
  uint32 slot = 1;
  // amount is 1 to 30000, and at most the slot's amount.
  uint32 amount = 2;
}

// PickUp walks next to a ground item and picks it up.
message PickUp {
  uint32 item = 1;
}

// RaiseStat spends status points to raise a stat, as rAthena's
// pc_statusup. The stat rises by up to amount, as far as the points and
// the job's maximum allow. When it cannot rise, nothing changes.
message RaiseStat {
  BaseStat stat = 1;
  // amount is 1 to 255.
  uint32 amount = 2;
}

// BaseStat is a stat that status points raise.
enum BaseStat {
  BASE_STAT_UNSPECIFIED = 0;
  BASE_STAT_STR = 1;
  BASE_STAT_AGI = 2;
  BASE_STAT_VIT = 3;
  BASE_STAT_INT = 4;
  BASE_STAT_DEX = 5;
  BASE_STAT_LUK = 6;
}

// EquipItem puts on the item in an inventory slot, as rAthena's
// pc_equipitem. The server answers with ItemEquipped, or EquipFailed.
message EquipItem {
  uint32 slot = 1;
  // position holds the equipment positions the player asks for, as
  // rAthena's EQP_ bits, such as 0x80 for the left accessory. 0 asks for
  // every position the item can take.
  uint32 position = 2;
}

// UnequipItem takes off the item in an inventory slot, as rAthena's
// pc_unequipitem. The server answers with ItemUnequipped.
message UnequipItem {
  uint32 slot = 1;
}

// InsertCard puts one card from a slot into the first free card slot of
// the item in another slot, as rAthena's pc_insert_card. The server
// answers with CardInserted, or InsertCardFailed.
message InsertCard {
  uint32 card_slot = 1;
  uint32 equip_slot = 2;
}

// PartyCommand is a party action, as rAthena's party packets. The server
// answers with PartyResult when the action fails or is refused, and with
// PartyInfo when the party changed. Party chat is Chat with
// CHAT_CHANNEL_PARTY.
message PartyCommand {
  oneof action {
    // create makes a party with the player as its leader, as
    // party_create.
    PartyCreate create = 1;
    // invite asks a player by name to join the leader's party, as
    // party_invite. Only the leader may invite.
    string invite = 2;
    // reply answers the invite of PartyInvite, as party_reply_invite.
    PartyReply reply = 3;
    // leave leaves the party, as party_leave. When the leader leaves,
    // the party breaks up, as rAthena does.
    bool leave = 4;
    // expel removes a member by name, as party_removemember. Only the
    // leader may expel.
    string expel = 5;
    // set_leader makes a member the leader, as party_changeleader. Only
    // the leader may do it.
    string set_leader = 6;
    // options changes the party's options, as party_changeoption. Only
    // the leader may do it.
    PartyOptions options = 7;
  }
}

message PartyCreate {
  // name is the party's name, 1 to 24 characters.
  string name = 1;
  // options are the item options. exp_share is always each at first, as
  // in rAthena.
  PartyOptions options = 2;
}

message PartyReply {
  // party_id is PartyInvite.party_id.
  uint64 party_id = 1;
  bool accept = 2;
}

// PartyOptions are a party's sharing options, as rAthena's party.exp and
// party.item.
message PartyOptions {
  // exp_even shares exp evenly among the members on the map, as exp 1.
  // Each member gets its own exp otherwise.
  bool exp_even = 1;
  // item_even gives each picked up item to a party member on the map, as
  // item & 2 (the distribution option).
  bool item_even = 2;
  // pickup_shared lets members pick up items their party's top attackers
  // may take, as item & 1 (the pick-up option).
  bool pickup_shared = 3;
}

// FriendCommand changes the friend list, as rAthena's friend packets. The
// server answers with FriendResult and FriendList.
message FriendCommand {
  oneof action {
    // add asks an online player by name to be friends, as
    // clif_parse_FriendsListAdd.
    string add = 1;
    // reply answers FriendRequest, as clif_parse_FriendsListReply.
    FriendReply reply = 2;
    // remove takes a friend off the list by name, on both sides, as
    // clif_parse_FriendsListRemove.
    string remove = 3;
  }
}

message FriendReply {
  // name is FriendRequest.from.
  string name = 1;
  bool accept = 2;
}

// PartyBookingCommand registers, searches or deletes a party booking ad,
// as rAthena's party booking. The server answers with PartyBookingList.
message PartyBookingCommand {
  oneof action {
    PartyBookingAd register = 1;
    PartyBookingSearch search = 2;
    // delete removes the player's own ad.
    bool delete = 3;
  }
}

// PartyBookingAd is an ad for a party: the level it is for, the map, and
// the jobs it wants.
message PartyBookingAd {
  // level is the level the ad is for, 1 to 999. A search for level L
  // finds ads from L - 15 to L, as party_booking_search.
  uint32 level = 1;
  // map is a map's asset name, such as map/prt_fild08, or empty.
  string map = 2;
  // jobs are up to 6 job IDs the party wants.
  repeated uint32 jobs = 3;
  // note is a line about the party, at most 80 characters.
  string note = 4;
}

message PartyBookingSearch {
  // level is 0 for any level.
  uint32 level = 1;
  // map is empty for any map.
  string map = 2;
  // job is a job ID the ad must want, or 0 for any job. rAthena searches
  // by map or by job: a search with both finds nothing.
  uint32 job = 3;
}

// GuildCommand is a guild action, as rAthena's guild packets. The server
// answers with GuildResult when the action fails or is refused, and with
// GuildInfo when the guild changed. Guild chat is Chat with
// CHAT_CHANNEL_GUILD.
message GuildCommand {
  oneof action {
    // create makes a guild with the player as its master, as
    // guild_create. It takes an Emperium with guild_emperium_check.
    string create = 1;
    // invite asks a player by name to join, as guild_invite. The
    // player's position must allow invites.
    string invite = 2;
    // reply answers GuildInvite, as guild_reply_invite.
    GuildReply reply = 3;
    // leave leaves the guild, as guild_leave, with a reason of at most
    // 39 characters. The master cannot leave.
    string leave = 4;
    // expel removes a member, as guild_expulsion. The player's position
    // must allow expelling, and the master cannot be expelled.
    GuildExpel expel = 5;
    // positions changes the guild's positions, as guild_change_position.
    // Only the master may do it.
    GuildPositions positions = 6;
    // member_position gives a member a position, as
    // guild_change_memberposition. Position 0 hands the guild to the
    // member, as guild_gm_change. Only the master may do it.
    GuildMemberPosition member_position = 7;
    // notice changes the guild notice, as guild_change_notice. Only the
    // master may do it.
    GuildNotice notice = 8;
    // skill_up raises a guild skill by its ID, as guild_skillup. Only the
    // master may do it.
    uint32 skill_up = 9;
    // ally asks the guild of an online player by name to be allies, as
    // guild_reqalliance. Only the master may do it.
    string ally = 10;
    // ally_reply answers GuildAllyRequest, as guild_reply_reqalliance.
    GuildReply ally_reply = 11;
    // enemy makes the guild of an online player by name an enemy, as
    // guild_opposition. Only the master may do it.
    string enemy = 12;
    // end_relation ends an alliance or an enemy relation, as
    // guild_delalliance. Only the master may do it.
    GuildRelationEnd end_relation = 13;
    // disband breaks the guild up, as guild_break: the master must name
    // the guild, and be its only member.
    string disband = 14;
  }
}

message GuildReply {
  // guild_id is GuildInvite.guild_id or GuildAllyRequest.guild_id.
  uint64 guild_id = 1;
  bool accept = 2;
}

message GuildExpel {
  string name = 1;
  // reason is at most 39 characters, as the expulsion list keeps.
  string reason = 2;
}

message GuildPositions {
  repeated GuildPosition positions = 1;
}

// GuildPosition is one of a guild's positions, as rAthena's
// guild_position.
message GuildPosition {
  // index is the position's number, from 0. Position 0 is the master's.
  uint32 index = 1;
  // name is 1 to 24 characters.
  string name = 2;
  bool can_invite = 3;
  bool can_expel = 4;
  bool can_use_storage = 5;
  // exp_tax is the percent of base exp members of this position give the
  // guild, at most guild_exp_limit.
  uint32 exp_tax = 6;
}

message GuildMemberPosition {
  string name = 1;
  uint32 position = 2;
}

// GuildNotice is the guild notice, as rAthena's mes1 and mes2.
message GuildNotice {
  // title is at most 59 characters, and text at most 119.
  string title = 1;
  string text = 2;
}

message GuildRelationEnd {
  uint64 guild_id = 1;
  // enemy ends an enemy relation. An alliance ends otherwise.
  bool enemy = 2;
}

// StorageCommand moves items between the inventory, the open storage
// window and the cart, as rAthena's storage and cart packets. The server
// answers with StorageAdd and StorageRemove, InventoryAdd and
// InventoryRemove, or StorageResult. Storage and guild storage open from
// an NPC. A player has one storage open at a time. The cart is open while
// the player has one.
message StorageCommand {
  oneof action {
    // put moves an amount from an inventory slot into the open storage,
    // as storage_storageadd and storage_guild_storageadd.
    StorageMove put = 1;
    // take moves an amount from a slot of the open storage into the
    // inventory, as storage_storageget and storage_guild_storageget.
    StorageMove take = 2;
    // close closes the storage window, as storage_storageclose and
    // storage_guild_storageclose.
    bool close = 3;
    // log asks for the guild storage log, as storage_guild_log_read.
    bool log = 4;
    // cart_put moves an amount from an inventory slot into the cart, as
    // pc_putitemtocart.
    StorageMove cart_put = 5;
    // cart_take moves an amount from a cart slot into the inventory, as
    // pc_getitemfromcart.
    StorageMove cart_take = 6;
    // cart_to_storage moves an amount from a cart slot into the open
    // storage, as storage_storageaddfromcart.
    StorageMove cart_to_storage = 7;
    // storage_to_cart moves an amount from a slot of the open storage
    // into the cart, as storage_storagegettocart.
    StorageMove storage_to_cart = 8;
  }
}

message StorageMove {
  // slot is the slot the amount leaves: an inventory slot for put and
  // cart_put, a storage slot for take and storage_to_cart, and a cart
  // slot for cart_take and cart_to_storage.
  uint32 slot = 1;
  uint32 amount = 2;
}

// TradeCommand is one step of a trade between two players, as rAthena's
// trade packets (trade.cpp). The server answers with TradeRequest,
// TradeOpen, TradeOffer, TradeLock, TradeClose and TradeResult.
message TradeCommand {
  oneof action {
    // request asks the player with this entity ID to trade, as
    // trade_traderequest.
    uint32 request = 1;
    // respond answers a TradeRequest, as trade_tradeack.
    bool respond = 2;
    // add_item offers an amount of an inventory slot, as
    // trade_tradeadditem.
    StorageMove add_item = 3;
    // add_zeny offers zeny, as trade_tradeaddzeny. It sets the amount;
    // a second offer is refused, as rAthena's client allows one.
    uint32 add_zeny = 4;
    // lock ends the offer, as trade_tradeok.
    bool lock = 5;
    // confirm completes the trade once both players locked, as
    // trade_tradecommit. The trade completes when both confirmed.
    bool confirm = 6;
    // cancel ends the trade, as trade_tradecancel.
    bool cancel = 7;
  }
}

// MailCommand is one step of mail (RODEX), as rAthena's mail.cpp and
// the RODEX packets of clif.cpp. The server answers with MailBox,
// MailRead and MailResult.
message MailCommand {
  oneof action {
    // open opens the mailbox window and lists the mails, as
    // clif_parse_Mail_refreshinbox. The mailbox does not open while the
    // player trades, vends, runs a buying store or has a storage open.
    bool open = 1;
    // read shows a mail's text and attachments, as clif_parse_Mail_read.
    uint64 read = 2;
    // send writes a mail, as clif_parse_Mail_send.
    MailSend send = 3;
    // take moves a mail's attachments into the inventory, as
    // clif_parse_Mail_getattach.
    MailTake take = 4;
    // delete removes a mail without attachments, as
    // clif_parse_Mail_delete.
    uint64 delete = 5;
    // close closes the mailbox window.
    bool close = 6;
  }
}

// MailSend is a new mail. The attachments are checked as mail_setitem
// checks each one, then the mail is sent as mail_send.
message MailSend {
  // to is the recipient's character name. The recipient may be offline.
  string to = 1;
  // title is 1 to 39 bytes, and body at most 499.
  string title = 2;
  string body = 3;
  // zeny is the zeny to attach. The fee is on top of it.
  uint32 zeny = 4;
  // items are the inventory slots and amounts to attach, at most the
  // mail_items limit.
  repeated StorageMove items = 5;
}

// MailTake takes the zeny, the items, or both, of one mail.
message MailTake {
  uint64 mail = 1;
  bool zeny = 2;
  bool items = 3;
}

// VendingCommand is one step of a vending shop, as rAthena's vending.cpp.
// A shop opens after the Vending skill, which sends VendingSetup. The
// server answers with VendingOpened, VendingList, VendingSold and
// VendingResult.
message VendingCommand {
  oneof action {
    // open opens the shop from cart slots, as vending_openvending.
    VendingOpen open = 1;
    // close closes the player's shop, as vending_closevending.
    bool close = 2;
    // browse asks for the shop of the player with this entity ID, as
    // vending_vendinglistreq.
    uint32 browse = 3;
    // buy buys from a shop, as vending_purchasereq.
    VendingBuy buy = 4;
    // cancel closes the setup window without opening a shop.
    bool cancel = 5;
  }
}

message VendingOpen {
  // title is 1 to 79 bytes, as MESSAGE_SIZE.
  string title = 1;
  // items are 1 to 2 + the Vending level lines, at most 12.
  repeated VendingLine items = 2;
}

message VendingLine {
  uint32 cart_slot = 1;
  uint32 amount = 2;
  // price is in zeny for one, at most vending_max_value.
  uint32 price = 3;
}

message VendingBuy {
  // vendor is the seller's entity ID, or 0 for the shop a store search
  // opened.
  uint32 vendor = 1;
  // shop is VendingList.shop, which changes when the shop reopens.
  uint32 shop = 2;
  repeated VendingBuyLine items = 3;
}

message VendingBuyLine {
  // index is VendingListItem.index.
  uint32 index = 1;
  uint32 amount = 2;
}

// BuyingStoreCommand is one step of a buying store, as rAthena's
// buyingstore.cpp. A store opens after player:open_buying_store, which
// sends BuyingStoreSetup.
message BuyingStoreCommand {
  oneof action {
    // open opens the store, as buyingstore_create.
    BuyingStoreOpen open = 1;
    // close closes the player's store, as buyingstore_close.
    bool close = 2;
    // browse asks for the store of the player with this entity ID, as
    // buyingstore_open.
    uint32 browse = 3;
    // sell sells inventory items to a store, as buyingstore_trade.
    BuyingStoreSell sell = 4;
    // cancel closes the setup window without opening a store.
    bool cancel = 5;
  }
}

message BuyingStoreOpen {
  // title is 1 to 79 bytes.
  string title = 1;
  // zeny_limit is the most zeny the store spends, at most the player's
  // zeny.
  uint32 zeny_limit = 2;
  // items are 1 to BuyingStoreSetup.slots lines, one per item.
  repeated BuyingStoreLine items = 3;
}

message BuyingStoreLine {
  uint32 item_id = 1;
  // amount is 1 to 9999.
  uint32 amount = 2;
  // price is in zeny for one, 1 to 99,990,000.
  uint32 price = 3;
}

message BuyingStoreSell {
  // buyer is the store owner's entity ID, or 0 for the store a store
  // search opened.
  uint32 buyer = 1;
  // store is BuyingStoreList.store.
  uint32 store = 2;
  repeated BuyingStoreSellLine items = 3;
}

message BuyingStoreSellLine {
  // slot is the inventory slot to sell from.
  uint32 slot = 1;
  uint32 item_id = 2;
  uint32 amount = 3;
}

// StoreSearchCommand searches vending shops and buying stores, as
// rAthena's searchstore.cpp. The window opens from player:search_stores,
// which sends StoreSearchOpen.
message StoreSearchCommand {
  oneof action {
    // query runs a search, which uses one of the window's uses.
    StoreSearchQuery query = 1;
    // next shows the next page of results.
    bool next = 2;
    // click picks a result, as searchstore_click: it shows the store's
    // place, or opens the store when the window allows it.
    uint32 click = 3;
    // close closes the window.
    bool close = 4;
  }
}

message StoreSearchQuery {
  // buying searches buying stores; vending shops otherwise.
  bool buying = 1;
  // item_ids are the items to find, 1 to 10.
  repeated uint32 item_ids = 2;
  // card_ids keep results with one of these cards, at most 10.
  repeated uint32 card_ids = 3;
  // min_price and max_price bound the price, 0 for no bound.
  uint32 min_price = 4;
  uint32 max_price = 5;
  // rolls and options keep results whose rolls or random options are in
  // range (strategy section 5.4). At most 8 of each.
  repeated StoreSearchRoll rolls = 6;
  repeated StoreSearchRoll options = 7;
}

// StoreSearchRoll bounds one rolled value: a roll by its name, or a
// random option by its name, such as VAR_MAXHPAMOUNT.
message StoreSearchRoll {
  string name = 1;
  int32 min = 2;
  int32 max = 3;
}
