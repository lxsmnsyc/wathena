syntax = "proto3";

package wathena.v1;

option go_package = "github.com/lxsmnsyc/wathena/schema/gen/go/wathena/v1;wathenav1";

// Hello is the first client message on a new connection.
message Hello {
  // protocol_version is PROTOCOL_VERSION from the client's schema build.
  uint32 protocol_version = 1;
  // session_token comes from the account service's login page.
  // It is sent here, not in the URL, so it does not appear in access logs.
  bytes session_token = 2;
  // client_name identifies the client build, such as "wathena-web/0.1.0".
  // It is for logs and support only. The server never trusts it.
  string client_name = 3;
  // language is a BCP 47 tag, such as "en" or "pt-BR".
  string language = 4;
}

// Welcome accepts a Hello.
message Welcome {
  uint32 protocol_version = 1;
  // server_time_ms is Unix time in milliseconds, for clock offset.
  uint64 server_time_ms = 2;
  // tick is the current tick of the player's zone.
  uint32 tick = 3;
  // net_id is the player's own entity ID for this connection.
  uint32 net_id = 4;
  // map is the asset name of the player's map, such as "map/prontera".
  // The player's own EntityAppear follows in the first Frame.
  string map = 5;
  // limits are the world ruleset's limits, so the client sizes its
  // windows (strategy section 6.8).
  Limits limits = 6;
  // world is the world's mode and the versions of its map generator, so
  // the client loads the generator only for a procedural world (strategy
  // section 8.1). A server that leaves it out runs a classic world.
  WorldInfo world = 7;
}

// WorldInfo describes the world a client joined.
message WorldInfo {
  WorldMode mode = 1;
  // generator_version is the map generator version the world records,
  // or 0 in a classic world (docs/specs/generator-v1.md).
  uint32 generator_version = 2;
  // rng_version is the seed tree spec the world records, such as
  // "rng-v1" (docs/specs/rng-v1.md), or empty in a classic world.
  string rng_version = 3;
}

// WorldMode is the world mode chosen when the world was made.
enum WorldMode {
  // A server that sends no mode runs a classic world.
  WORLD_MODE_UNSPECIFIED = 0;
  // rAthena's fixed maps.
  WORLD_MODE_CLASSIC = 1;
  // Maps generated from the world seed.
  WORLD_MODE_PROCEDURAL = 2;
}

// Limits are limits that rAthena compiles in and a ruleset sets
// (proposal 0002, review decisions 27 and 29). The named fields hold
// each limit's base. ranges holds every limit's base and max.
message Limits {
  // party_members is the most members a party holds, as MAX_PARTY.
  uint32 party_members = 1;
  // friends is the most names a friend list holds, as MAX_FRIENDS.
  uint32 friends = 2;
  // block_list is the most names a block list holds, as
  // MAX_IGNORE_LIST.
  uint32 block_list = 3;
  // guild_members is the most members a guild holds before Guild
  // Extension, which adds 6 per level.
  uint32 guild_members = 4;
  // guild_positions is the positions of a guild, as MAX_GUILDPOSITION.
  uint32 guild_positions = 5;
  // guild_allies and guild_enemies are the most allied and enemy guilds,
  // as max_guild_alliance.
  uint32 guild_allies = 6;
  uint32 guild_enemies = 7;
  // guild_storage is the most slots a guild storage holds.
  uint32 guild_storage = 8;
  // inventory_slots is the inventory slots of a new character, as
  // INVENTORY_BASE_SIZE.
  uint32 inventory_slots = 9;
  // storage_slots is the slots of an account's storage, as MAX_STORAGE.
  uint32 storage_slots = 10;
  // cart_slots is the slots of a cart, as MAX_CART.
  uint32 cart_slots = 11;
  // ranges lists every limit with its base and max, in the order of the
  // server's rules.LimitBounds.
  repeated LimitRange ranges = 12;
  // mail_items is the most items one mail holds, as MAIL_MAX_ITEM.
  uint32 mail_items = 13;
  // mailbox is the most mails a mailbox holds.
  uint32 mailbox = 14;
}

// LimitRange is one limit: base is what a player or guild starts with,
// and max is where expansions stop.
message LimitRange {
  string name = 1;
  uint32 base = 2;
  uint32 max = 3;
}

message Ping {
  uint32 nonce = 1;
}

message Pong {
  uint32 nonce = 1;
  uint64 server_time_ms = 2;
}

// Disconnect is the last message before the server closes the connection.
message Disconnect {
  DisconnectReason reason = 1;
  // message is shown to the player, in their language.
  string message = 2;
}

enum DisconnectReason {
  DISCONNECT_REASON_UNSPECIFIED = 0;
  DISCONNECT_REASON_VERSION_UNSUPPORTED = 1;
  DISCONNECT_REASON_SESSION_INVALID = 2;
  DISCONNECT_REASON_LOGGED_IN_ELSEWHERE = 3;
  DISCONNECT_REASON_RATE_LIMITED = 4;
  DISCONNECT_REASON_BAD_MESSAGE = 5;
  // The account is banned. message has the reason and the end time
  // (decision 0030).
  DISCONNECT_REASON_BANNED = 6;
  DISCONNECT_REASON_SERVER_SHUTDOWN = 7;
  // The login session that opened this connection ended, such as at
  // logout or when a new login in the same browser replaced it.
  DISCONNECT_REASON_LOGGED_OUT = 8;
  // The player went on autotrade: the shop stays open while the
  // connection closes (player:autotrade).
  DISCONNECT_REASON_AUTOTRADE = 9;
  // Staff kicked the player, with @kick or the admin screens. message
  // has the reason (decision 0030).
  DISCONNECT_REASON_KICKED = 10;
  // The server restarts as staff planned it. message has the reason. A
  // new login in the last minute before the restart gets it too
  // (decision 0031).
  DISCONNECT_REASON_RESTART = 11;
  // The account is set to be deleted. Its characters cannot play until
  // the deletion is cancelled. message has the date (decision 0032).
  DISCONNECT_REASON_ACCOUNT_DELETION = 12;
  // A server error stopped the player's actions. The character is as
  // it was at its last save (review 2026-10).
  DISCONNECT_REASON_SERVER_ERROR = 13;
}
