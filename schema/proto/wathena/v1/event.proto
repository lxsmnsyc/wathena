syntax = "proto3";

package wathena.v1;

import "wathena/v1/command.proto";

option go_package = "github.com/lxsmnsyc/wathena/schema/gen/go/wathena/v1;wathenav1";

// Event is one thing the player sees change.
// Clients must skip Event cases they do not know, so new cases can be added.
message Event {
  oneof body {
    EntityAppear appear = 1;
    EntityVanish vanish = 2;
    EntityMove move = 3;
    EntityStop stop = 4;
    StatUpdate stats = 5;
    Damage damage = 6;
    SkillCast skill_cast = 7;
    ChatMessage chat = 8;
    NpcDialog npc_dialog = 9;
    EffectPlay effect = 10;
    ItemTaken item_taken = 11;
    InventoryAdd inventory_add = 12;
    PickUpFailed pick_up_failed = 13;
    InventoryUpdate inventory = 14;
    InventoryRemove inventory_remove = 15;
    ItemUsed item_used = 16;
    UseItemFailed use_item_failed = 17;
    DropItemFailed drop_item_failed = 18;
    MapChange map_change = 19;
    NpcImage npc_image = 20;
    NpcProgress npc_progress = 21;
    Emotion emotion = 22;
    MinimapMark minimap_mark = 23;
    ShopOpen shop_open = 24;
    ShopResult shop_result = 25;
    ItemEquipped item_equipped = 26;
    ItemUnequipped item_unequipped = 27;
    EquipFailed equip_failed = 28;
    CardInserted card_inserted = 29;
    InsertCardFailed insert_card_failed = 30;
    LookChange look_change = 31;
    StatusIcon status_icon = 32;
    OptionChange option_change = 33;
    SkillList skill_list = 34;
    SkillCastCancel skill_cast_cancel = 35;
    SkillEffect skill_effect = 36;
    SkillFailed skill_failed = 37;
    SkillCooldown skill_cooldown = 38;
    ItemRollsChange item_rolls_change = 39;
    JobName job_name = 40;
    WhisperResult whisper_result = 41;
    ChatRefused chat_refused = 42;
    ChannelJoined channel_joined = 43;
    ChannelLeft channel_left = 44;
    ChannelList channel_list = 45;
    ChannelMembers channel_members = 46;
    ChannelFailed channel_failed = 47;
    BlockList block_list = 48;
    SanctionNotice sanction = 49;
    ReportResult report_result = 50;
    PartyInfo party_info = 51;
    PartyMemberUpdate party_member = 52;
    PartyInvite party_invite = 53;
    PartyResult party_result = 54;
    FriendList friend_list = 55;
    FriendStatus friend_status = 56;
    FriendRequest friend_request = 57;
    FriendResult friend_result = 58;
    PartyBookingList party_booking_list = 59;
    PartyItemShared party_item_shared = 60;
    GuildInfo guild_info = 61;
    GuildMemberUpdate guild_member = 62;
    GuildInvite guild_invite = 63;
    GuildResult guild_result = 64;
    GuildAllyRequest guild_ally_request = 65;
    EntityGuild entity_guild = 66;
    StorageOpen storage_open = 67;
    StorageAdd storage_add = 68;
    StorageRemove storage_remove = 69;
    StorageClose storage_close = 70;
    StorageResult storage_result = 71;
    GuildStorageLog guild_storage_log = 72;
    StorageItems storage_items = 73;
    TradeRequest trade_request = 74;
    TradeOpen trade_open = 75;
    TradeOffer trade_offer = 76;
    TradeLock trade_lock = 77;
    TradeClose trade_close = 78;
    TradeResult trade_result = 79;
    CurrencyUpdate currencies = 80;
    MailBox mail_box = 81;
    MailRead mail_read = 82;
    MailNew mail_new = 83;
    MailResult mail_result = 84;
    VendingSetup vending_setup = 85;
    VendingOpened vending_opened = 86;
    VendingList vending_list = 87;
    VendingSold vending_sold = 88;
    VendingResult vending_result = 89;
    EntityShop entity_shop = 90;
    BuyingStoreSetup buying_store_setup = 91;
    BuyingStoreOpened buying_store_opened = 92;
    BuyingStoreList buying_store_list = 93;
    BuyingStoreBought buying_store_bought = 94;
    BuyingStoreResult buying_store_result = 95;
    StoreSearchOpen store_search_open = 96;
    StoreSearchResults store_search_results = 97;
    StoreSearchResult store_search_result = 98;
    WorldEventNotice world_event_notice = 99;
    WorldEventList world_event_list = 100;
    PlayerLimits player_limits = 101;
    WorldMap world_map = 102;
    QuestList quest_list = 103;
    QuestUpdate quest_update = 104;
    QuestRemove quest_remove = 105;
    QuestIcon quest_icon = 106;
    EffectRemove effect_remove = 107;
    NpcProgressBar npc_progress_bar = 108;
    SoundPlay sound = 109;
    MusicPlay music = 110;
    DigitsShow digits = 111;
    QuestLogOpen quest_log_open = 112;
  }
}

// QuestList is the player's quest log: its active and inactive quests,
// in the order it took them (proposal 0002, review decision 45). It
// comes after login and after each map change, and replaces the list
// before. Complete quests are not in it, as in rAthena's quest window.
message QuestList {
  repeated QuestInfo quests = 1;
}

// QuestInfo is one quest of the quest log.
message QuestInfo {
  // id is the quest's ID of data/quests.yml.
  uint32 id = 1;
  string title = 2;
  // active is false for a quest the player marked inactive.
  bool active = 3;
  // limit_ms is the time left until the quest's time limit ends, 0 once
  // it passed, or -1 for a quest without a limit.
  sint64 limit_ms = 4;
  // objectives are the hunt objectives, in order.
  repeated QuestObjective objectives = 5;
}

// QuestObjective is one hunt objective of a quest.
message QuestObjective {
  // label is the monster's name, or the text of an objective's
  // filters, such as "Prontera Fields, Plant, Small", as rAthena's
  // clif_quest_string.
  string label = 1;
  // monster is the monster ID of an objective that counts one monster,
  // or 0.
  uint32 monster = 2;
  // count is the kills counted so far, and goal the kills asked for.
  uint32 count = 3;
  uint32 goal = 4;
  // min_level and max_level bound the monsters' level, 0 for no bound.
  uint32 min_level = 5;
  uint32 max_level = 6;
}

// QuestUpdate adds a quest to the log, or replaces the quest with the
// same id: a new quest, a kill counted, or a change between active and
// inactive.
message QuestUpdate {
  QuestInfo quest = 1;
}

// QuestRemove takes a quest out of the log: removed, changed into
// another quest, or complete.
message QuestRemove {
  uint32 id = 1;
}

// QuestIcon shows an icon over an NPC to this player alone, as rAthena's
// showevent and questinfo (clif_quest_show_event). icon is a name of
// wa.QuestIcon, such as quest or quest_question, or empty to remove the
// icon. The icon stays while the player is on the map, and shows again
// when the NPC comes back into view.
message QuestIcon {
  // npc is the NPC's entity ID on this connection.
  uint32 npc = 1;
  string icon = 2;
  // mark is the NPC's minimap mark, as rAthena's QMARK_ colors: yellow,
  // green or purple, or empty for none.
  string mark = 3;
}

// QuestLogOpen opens the quest log window, as rAthena's open_quest_ui.
// quest is a quest of the log to show, or 0 for none.
message QuestLogOpen {
  uint32 quest = 1;
}

// WorldMap is the part of a procedural world's map graph that the
// player's character has found (proposal 0002, review decision 43): the
// maps it visited, with their names and bands, and the maps a warp of
// those leads to, without them. It comes after login and each time the
// character enters a map for the first time, and replaces the one
// before. A classic world sends none.
message WorldMap {
  repeated WorldMapNode maps = 1;
  // links are the warps between the maps, each pair once.
  repeated WorldMapLink links = 2;
}

// WorldMapNode is one map of the world map.
message WorldMapNode {
  // id is the map ID, such as gen:town:t2.
  string id = 1;
  // kind is field, town, dungeon or home.
  string kind = 2;
  // name is the display name, or empty for a map the character has not
  // visited.
  string name = 3;
  // x and y are the grid cell of a field, of a town's or the home map's
  // seat, or of a dungeon's entrance field. North is +y.
  sint32 x = 4;
  sint32 y = 5;
  // floor is a dungeon floor's number, from 1.
  uint32 floor = 6;
  bool visited = 7;
  // min_level and max_level are a visited map's level band.
  uint32 min_level = 8;
  uint32 max_level = 9;
}

// WorldMapLink is a warp between two maps of the world map.
message WorldMapLink {
  string a = 1;
  string b = 2;
}

// JobName names the player's job, from its record's display_name. It
// comes after login and after each job change, since the client data
// tables do not know the jobs mods add.
message JobName {
  // job is the job ID, as STAT_ID_JOB.
  uint32 job = 1;
  string name = 2;
}

// MapChange moves the player to another map, after a warp. It is the
// first event of the first frame from the new map. The client clears
// every entity it shows, loads the map, and goes on. The player's own
// EntityAppear follows, as after Welcome, and entity IDs start again for
// the new map.
message MapChange {
  // map is the asset name of the new map, such as "map/prt_fild08".
  string map = 1;
  // x and y are the player's cell on the new map.
  uint32 x = 2;
  uint32 y = 3;
  // net_id is the player's own entity ID on the new map.
  uint32 net_id = 4;
}

// EntityKind is what an entity is.
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_NPC = 3;
  ENTITY_KIND_PET = 4;
  ENTITY_KIND_HOMUNCULUS = 5;
  ENTITY_KIND_MERCENARY = 6;
  ENTITY_KIND_ITEM = 7;
  ENTITY_KIND_SKILL_UNIT = 8;
}

// EntityAppear adds an entity to the player's view.
// Entity IDs are per connection. They are never database IDs.
//
// A warp portal is ENTITY_KIND_NPC with look.body 45, rAthena's
// JT_WARPNPC sprite, and no name.
message EntityAppear {
  uint32 id = 1;
  EntityKind kind = 2;
  uint32 x = 3;
  uint32 y = 4;
  // dir is 0 to 7, starting south and turning clockwise, as in RO.
  uint32 dir = 5;
  // look is the entity's appearance. Its meaning depends on kind.
  Look look = 6;
  string name = 7;
  // walk_ms is the time to walk one cell straight.
  uint32 walk_ms = 8;
  // hp_permille is HP as a fraction of max HP, from 0 to 1000.
  // Exact HP is only sent for the player, party members, and homunculi.
  uint32 hp_permille = 9;
  // item is set for ENTITY_KIND_ITEM.
  GroundItem item = 10;
  // options are what the entity's status changes show, such as Stun's
  // stars. Unset for none.
  Options options = 11;
  // skill_unit is set for ENTITY_KIND_SKILL_UNIT: a cell of a ground
  // skill, such as one fire of Fire Wall.
  SkillUnit skill_unit = 12;
  // guild is a player's guild, shown with its name, or unset.
  GuildBadge guild = 13;
  // title is an NPC's title, shown with its name, as rAthena's
  // setunittitle, or empty.
  string title = 14;
}

// GuildBadge is what others see of a player's guild, as clif_name's
// guild name and position, and the emblem.
message GuildBadge {
  uint64 guild_id = 1;
  string name = 2;
  // emblem_version is 0 for a guild without an emblem. The emblem is the
  // PNG at /emblems/<guild_id>/<emblem_version>.png on the game server.
  uint32 emblem_version = 3;
  // position is the name of the player's position.
  string position = 4;
}

// EntityGuild changes the guild shown with an entity in sight, as
// clif_guild_emblem_area and clif_name_area: after a join, a leave, a
// new position name or a new emblem. guild is unset for none.
message EntityGuild {
  uint32 id = 1;
  GuildBadge guild = 2;
}

// SkillUnit is one cell of a ground skill, as rAthena's skill_unit.
message SkillUnit {
  // unit_id is rAthena's UNT_ ID, which picks the client's effect.
  uint32 unit_id = 1;
  uint32 skill_id = 2;
  // caster is the entity ID of the unit's caster, when the player sees
  // it, or 0.
  uint32 caster = 3;
}

// GroundItem is an item lying on a cell.
message GroundItem {
  uint32 item_id = 1;
  uint32 amount = 2;
  // sub_x and sub_y place the item inside its cell, from 0 to 15.
  uint32 sub_x = 3;
  uint32 sub_y = 4;
  // dropped is true when the item has just fallen, so the client plays the
  // drop. It is false for items that were already on the ground.
  bool dropped = 5;
}

// Look lists sprite and palette IDs from the client data tables. For a
// player, weapon is the weapon type of its attacks (rAthena's W_ types),
// shield the view of its shield, and head_top, head_mid, head_bottom and
// robe the views of its headgear and garment, as rAthena's view_data. 0
// is none.
message Look {
  uint32 body = 1;
  uint32 hair = 2;
  uint32 hair_color = 3;
  uint32 cloth_color = 4;
  uint32 weapon = 5;
  uint32 shield = 6;
  uint32 head_top = 7;
  uint32 head_mid = 8;
  uint32 head_bottom = 9;
  uint32 robe = 10;
  uint32 sex = 11;
  // weapon_view is the view the server gave the right hand's weapon when
  // its record names a view_sprite, from 1,000,000, or 0. The client data
  // names its sprite. weapon stays the weapon type. A shield's view is in
  // shield, as before.
  uint32 weapon_view = 12;
  // companion and mount are the record IDs of the player's companion and
  // mount, from data/companions.yml and data/mounts.yml, or 0 for none.
  // The client data names the art of records that have it. The option
  // bits still show the core record each acts as.
  uint32 companion = 13;
  uint32 mount = 14;
  // npc_view is how an NPC's body shows, as rAthena allows any class as
  // an NPC's view: an NPC sprite, a monster's sprite, or a character of
  // the job in body, with the look's sex, hair, colors and headgear.
  NpcView npc_view = 15;
}

// NpcView is what an NPC's look.body names.
enum NpcView {
  // UNSPECIFIED is an NPC sprite.
  NPC_VIEW_UNSPECIFIED = 0;
  NPC_VIEW_MONSTER = 1;
  NPC_VIEW_JOB = 2;
}

message EntityVanish {
  uint32 id = 1;
  VanishReason reason = 2;
}

enum VanishReason {
  VANISH_REASON_UNSPECIFIED = 0;
  VANISH_REASON_OUT_OF_SIGHT = 1;
  VANISH_REASON_DIED = 2;
  VANISH_REASON_LOGGED_OUT = 3;
  VANISH_REASON_TELEPORTED = 4;
  // An item was picked up. ItemTaken comes before it.
  VANISH_REASON_PICKED_UP = 5;
  // An item lay on the ground too long.
  VANISH_REASON_EXPIRED = 6;
}

// EntityMove starts a walk. The client times each step from walk_ms.
message EntityMove {
  uint32 id = 1;
  uint32 from_x = 2;
  uint32 from_y = 3;
  // steps holds one direction (0 to 7) per 4 bits, low bits first,
  // numbered as EntityAppear.dir. A trailing 0xF fills the last byte when
  // the step count is odd.
  bytes steps = 4;
  // start_ms is when the walk starts, relative to the start of the frame's tick.
  sint32 start_ms = 5;
  uint32 walk_ms = 6;
}

// EntityStop ends a walk early at a cell.
message EntityStop {
  uint32 id = 1;
  uint32 x = 2;
  uint32 y = 3;
}

// StatUpdate sends changed values of the player's own stats.
message StatUpdate {
  repeated Stat stats = 1;
}

message Stat {
  StatId id = 1;
  int64 value = 2;
}

enum StatId {
  STAT_ID_UNSPECIFIED = 0;
  STAT_ID_HP = 1;
  STAT_ID_MAX_HP = 2;
  STAT_ID_SP = 3;
  STAT_ID_MAX_SP = 4;
  STAT_ID_BASE_LEVEL = 5;
  STAT_ID_JOB_LEVEL = 6;
  STAT_ID_BASE_EXP = 7;
  STAT_ID_JOB_EXP = 8;
  STAT_ID_ZENY = 9;
  STAT_ID_WEIGHT = 10;
  STAT_ID_MAX_WEIGHT = 11;
  STAT_ID_STR = 12;
  STAT_ID_AGI = 13;
  STAT_ID_VIT = 14;
  STAT_ID_INT = 15;
  STAT_ID_DEX = 16;
  STAT_ID_LUK = 17;
  STAT_ID_ATK = 18;
  STAT_ID_MATK = 19;
  STAT_ID_DEF = 20;
  STAT_ID_MDEF = 21;
  STAT_ID_HIT = 22;
  STAT_ID_FLEE = 23;
  STAT_ID_CRITICAL = 24;
  STAT_ID_ASPD = 25;
  STAT_ID_STATUS_POINTS = 26;
  STAT_ID_SKILL_POINTS = 27;
  // NEXT_BASE_EXP and NEXT_JOB_EXP are the exp the current level needs.
  // They are 0 at the maximum level.
  STAT_ID_NEXT_BASE_EXP = 28;
  STAT_ID_NEXT_JOB_EXP = 29;
  // STR_COST to LUK_COST are the status points that raising each stat by
  // 1 costs, as rAthena's SP_USTR to SP_ULUK. They are 0 at the stat's
  // maximum.
  STAT_ID_STR_COST = 30;
  STAT_ID_AGI_COST = 31;
  STAT_ID_VIT_COST = 32;
  STAT_ID_INT_COST = 33;
  STAT_ID_DEX_COST = 34;
  STAT_ID_LUK_COST = 35;
  // JOB is the player's job ID, which changes with a job change: rAthena's
  // job ID, or a mod job's ID, which JobName names. The look's body shows
  // the job's look, or the class a rider shows.
  STAT_ID_JOB = 36;
}

message Damage {
  uint32 source = 1;
  uint32 target = 2;
  // amount is 0 for a miss.
  int64 amount = 3;
  uint32 hits = 4;
  DamageKind kind = 5;
  // delay_ms is when the hit shows, relative to the start of the frame's tick.
  uint32 delay_ms = 6;
  // skill_id is 0 for normal attacks.
  uint32 skill_id = 7;
  // target_hp_permille is the target's HP after the hit, from 0 to 1000.
  uint32 target_hp_permille = 8;
}

enum DamageKind {
  DAMAGE_KIND_UNSPECIFIED = 0;
  DAMAGE_KIND_NORMAL = 1;
  DAMAGE_KIND_CRITICAL = 2;
  DAMAGE_KIND_MISS = 3;
  DAMAGE_KIND_LUCKY_DODGE = 4;
  // A heal: amount is the HP healed. For an item heal, source and target
  // are the player, and only the player gets it.
  DAMAGE_KIND_HEAL = 5;
}

// SkillCast shows an entity starting to cast a skill, as
// clif_skillcasting: the client shows the cast bar of cast_ms over it.
// A cast without a cast time sends none.
message SkillCast {
  uint32 source = 1;
  uint32 skill_id = 2;
  uint32 level = 3;
  uint32 cast_ms = 4;
  oneof target {
    uint32 entity = 5;
    Cell cell = 6;
  }
  // element is the skill's element, which picks the cast effect's color.
  uint32 element = 7;
}

// SkillCastCancel shows an entity's cast stopping before it finished, as
// clif_skillcastcancel: hit, stunned, or out of range.
message SkillCastCancel {
  uint32 source = 1;
}

// SkillEffect shows a skill taking effect without damage, as
// clif_skill_nodamage and clif_skill_poseffect: a heal, a buff, or a
// ground skill.
message SkillEffect {
  uint32 source = 1;
  uint32 skill_id = 2;
  uint32 level = 3;
  oneof target {
    uint32 entity = 4;
    Cell cell = 5;
  }
  // value is what the effect shows, such as the HP healed, or the
  // level.
  int64 value = 6;
  // ok is false when the skill failed on the target, such as a status
  // that did not start.
  bool ok = 7;
}

// SkillFailed tells the player that a skill could not be used, as
// clif_skill_fail.
message SkillFailed {
  uint32 skill_id = 1;
  SkillFailure reason = 2;
}

// SkillFailure is why a skill failed, as rAthena's USESKILL_FAIL_ values.
enum SkillFailure {
  SKILL_FAILURE_UNSPECIFIED = 0;
  // LEVEL is rAthena's USESKILL_FAIL_LEVEL: the skill failed.
  SKILL_FAILURE_LEVEL = 1;
  SKILL_FAILURE_SP_INSUFFICIENT = 2;
  SKILL_FAILURE_HP_INSUFFICIENT = 3;
  SKILL_FAILURE_STUFF_INSUFFICIENT = 4;
  SKILL_FAILURE_SKILLINTERVAL = 5;
  SKILL_FAILURE_MONEY = 6;
  SKILL_FAILURE_THIS_WEAPON = 7;
  SKILL_FAILURE_REDJAMSTONE = 8;
  SKILL_FAILURE_BLUEJAMSTONE = 9;
  SKILL_FAILURE_WEIGHTOVER = 10;
  SKILL_FAILURE_ARROW = 11;
  SKILL_FAILURE_CART = 12;
  SKILL_FAILURE_POS = 13;
  // RANGE is out of range: the target was too far.
  SKILL_FAILURE_RANGE = 14;
  // TARGET is a target the skill cannot hit.
  SKILL_FAILURE_TARGET = 15;
  // STATUS is a status that blocks skills, such as Silence.
  SKILL_FAILURE_STATUS = 16;
  // HOLYWATER is AL_HOLYWATER without an Empty Bottle.
  SKILL_FAILURE_HOLYWATER = 17;
}

// SkillCooldown tells the player that a skill cannot be used again for
// a time, as clif_skill_cooldown. skill_id 0 is the after-cast delay of
// every skill.
message SkillCooldown {
  uint32 skill_id = 1;
  uint32 ms = 2;
}

// SkillList is the player's skill list, as clif_skillinfoblock: the
// skills it learned and those of its tree it may learn. It is sent at
// login and whenever the list changes. Skill points come in StatUpdate.
message SkillList {
  repeated SkillInfo skills = 1;
}

// SkillInfo is one skill of the skill list.
message SkillInfo {
  uint32 skill_id = 1;
  // level is the learned level, 0 for a skill the player may learn.
  uint32 level = 2;
  uint32 max_level = 3;
  // name is the skill's key, such as SM_BASH, and display_name the name
  // players see.
  string name = 4;
  string display_name = 5;
  SkillTarget target = 6;
  // sp is the SP cost at the learned level.
  uint32 sp = 7;
  // range is the range in cells at the learned level.
  uint32 range = 8;
  // upgradable is set when a skill point may raise it.
  bool upgradable = 9;
  // icon is the skill ID whose icon and effects the client shows: the
  // skill's own, or for a mod's skill the core skill its data names.
  uint32 icon = 10;
  // requires lists the skills and levels it needs, from its job's tree.
  repeated SkillRequirement requires = 11;
}

// SkillRequirement is a skill and level that a skill of the tree needs.
message SkillRequirement {
  uint32 skill_id = 1;
  uint32 level = 2;
}

// SkillTarget is how a skill picks its target, as rAthena's INF_ types.
enum SkillTarget {
  SKILL_TARGET_UNSPECIFIED = 0;
  SKILL_TARGET_PASSIVE = 1;
  SKILL_TARGET_ENEMY = 2;
  SKILL_TARGET_GROUND = 3;
  SKILL_TARGET_SELF = 4;
  SKILL_TARGET_SUPPORT = 5;
  SKILL_TARGET_TRAP = 6;
}

message ChatMessage {
  ChatChannel channel = 1;
  // from is the speaker's entity ID for local chat, 0 otherwise. An NPC
  // that speaks aloud, as rAthena's npctalk, is a speaker too. A staff
  // member hidden with @hide has no entity the player knows, so its
  // local chat has from 0 and from_name set.
  uint32 from = 2;
  string from_name = 3;
  string text = 4;
  // color is the text's color as 0xRRGGBB for an announcement, a
  // monster's chat line, an NPC's line with a color (npctalk) or a
  // server line with a color (dispbottom), or 0 for the channel's own
  // color. A monster's
  // line is local chat in its skills entry's chat_color. A channel's
  // line has the channel's color.
  uint32 color = 5;
  // channel_name names the channel of CHAT_CHANNEL_NAMED, such as #trade.
  string channel_name = 6;
  // line_id identifies a line a player said, for Report. It is empty
  // for lines no player said, such as NPC lines and announcements.
  bytes line_id = 7;
  // from_mod is the ID of the mod whose script sent a whisper or an
  // announcement, such as example.bank. It is empty for players, for
  // core's scripts and for the server. The client shows it with the
  // line, so a mod cannot pass for a player or for staff.
  string from_mod = 8;
}

// WhisperResult answers the player's whisper, as clif_wis_end.
message WhisperResult {
  // to is the name the whisper went to, as the target spells it when it
  // was sent.
  string to = 1;
  WhisperOutcome outcome = 2;
  // text and line_id are the line as sent, after the chat filter, when
  // outcome is SENT.
  string text = 3;
  bytes line_id = 4;
}

enum WhisperOutcome {
  WHISPER_OUTCOME_UNSPECIFIED = 0;
  WHISPER_OUTCOME_SENT = 1;
  // No character of that name is online, as ACKWHISPER_TARGET_OFFLINE.
  WHISPER_OUTCOME_NOT_ONLINE = 2;
  // The target blocks the player, as ACKWHISPER_IGNORED.
  WHISPER_OUTCOME_BLOCKED = 3;
}

// ChatRefused tells the player that a line it said was not sent.
message ChatRefused {
  ChatChannel channel = 1;
  // to is the whisper's target or the channel's name, when there is one.
  string to = 2;
  ChatRefusal reason = 3;
}

enum ChatRefusal {
  CHAT_REFUSAL_UNSPECIFIED = 0;
  // The player is muted. A SanctionNotice says until when.
  CHAT_REFUSAL_MUTED = 1;
  // The line has a word that the server's chat filter rejects.
  CHAT_REFUSAL_FILTERED = 2;
  // The player is not in the channel, or has no party for party chat.
  CHAT_REFUSAL_NOT_IN_CHANNEL = 3;
  // The channel does not let its members talk, as rAthena's chat
  // option.
  CHAT_REFUSAL_CANNOT_CHAT = 4;
  // The line went over the chat rate limit, or the channel's delay since
  // the player's last line has not passed, as rAthena's "You're talking
  // too fast!".
  CHAT_REFUSAL_TOO_FAST = 5;
}

// ChannelJoined tells the player it is in a channel: after ChannelCommand
// JOIN, at login for channels that players join by themselves, or when a
// mod adds the player.
message ChannelJoined {
  // name is the channel's name with its #, such as #trade.
  string name = 1;
  // display_name is what the client shows before each line, such as
  // [Trade], as rAthena's alias.
  string display_name = 2;
  // color is the lines' color as 0xRRGGBB.
  uint32 color = 3;
  // can_leave is false for a channel the player may not leave.
  bool can_leave = 4;
  // can_chat is false for a channel whose members only read.
  bool can_chat = 5;
}

// ChannelLeft tells the player it is no longer in a channel.
message ChannelLeft {
  string name = 1;
}

// ChannelList answers ChannelCommand LIST: the channels the player may
// join, and those it is in.
message ChannelList {
  repeated ChannelInfo channels = 1;
}

message ChannelInfo {
  string name = 1;
  string display_name = 2;
  uint32 color = 3;
  // members is how many players are in the channel.
  uint32 members = 4;
  bool joined = 5;
}

// ChannelMembers answers ChannelCommand MEMBERS.
message ChannelMembers {
  string name = 1;
  // names are the members' character names, sorted.
  repeated string names = 2;
}

// ChannelFailed tells the player why a ChannelCommand did nothing.
message ChannelFailed {
  string name = 1;
  ChannelFailure reason = 2;
}

enum ChannelFailure {
  CHANNEL_FAILURE_UNSPECIFIED = 0;
  // No channel has the name.
  CHANNEL_FAILURE_UNKNOWN = 1;
  // The player is already in the channel.
  CHANNEL_FAILURE_ALREADY_JOINED = 2;
  // The channel only takes players a mod adds.
  CHANNEL_FAILURE_INVITE_ONLY = 3;
  // The player is not in the channel.
  CHANNEL_FAILURE_NOT_JOINED = 4;
  // The player may not leave the channel.
  CHANNEL_FAILURE_CANNOT_LEAVE = 5;
  // The player is in as many channels as it may be.
  CHANNEL_FAILURE_TOO_MANY = 6;
}

// BlockList is the player's block list: after login and after each Block.
message BlockList {
  // names are the blocked character names, in the order they were added.
  repeated string names = 1;
  // full is set when a Block did nothing because the list holds the most
  // names it may hold.
  bool full = 2;
}

// SanctionNotice tells the player about a mute or a jail: when it starts,
// after login while it lasts, when a muted player tries to talk, and
// when it ends.
message SanctionNotice {
  SanctionKind kind = 1;
  // reason is the staff's or the mod's reason.
  string reason = 2;
  // ends_at_ms is when it ends, in Unix milliseconds.
  int64 ends_at_ms = 3;
  // ended is set when the sanction ended.
  bool ended = 4;
}

enum SanctionKind {
  SANCTION_KIND_UNSPECIFIED = 0;
  // MUTE stops the player's chat, as rAthena's SC_NOCHAT.
  SANCTION_KIND_MUTE = 1;
  // JAIL holds the player on the jail map, as rAthena's SC_JAILED.
  SANCTION_KIND_JAIL = 2;
}

// ReportResult answers Report.
message ReportResult {
  ReportOutcome outcome = 1;
}

enum ReportOutcome {
  REPORT_OUTCOME_UNSPECIFIED = 0;
  // The report was saved for the staff.
  REPORT_OUTCOME_SENT = 1;
  // The reported line is not among the lines the player saw in the last
  // 5 minutes.
  REPORT_OUTCOME_LINE_NOT_FOUND = 2;
  // The player sent too many reports in the last hour.
  REPORT_OUTCOME_TOO_MANY = 3;
  // The name is not a valid character name.
  REPORT_OUTCOME_BAD_NAME = 4;
}

// NpcDialog is one step of an NPC dialog. Text is in the player's language.
//
// The client keeps one dialog window per player. Lines add to the
// window, which opens when it is closed. A step without a prompt only
// adds lines. A step with a prompt shows it, and the player's answer
// quotes the step's dialog in NpcReply. Lines may hold RO color codes,
// such as ^FF0000, and item links as
// <ITEMLINK>name<INFO>item ID</INFO></ITEMLINK>. Clients show them as
// text, never as HTML.
message NpcDialog {
  uint32 npc = 1;
  // dialog identifies this step. NpcReply must quote it.
  uint32 dialog = 2;
  repeated string lines = 3;
  oneof prompt {
    // next shows a Next button. Its answer clears the window's lines.
    bool next = 4;
    // menu shows options. The answer is the chosen option, from 1, or
    // close to cancel.
    NpcMenu menu = 5;
    // input_text asks for text of at most text_max characters.
    bool input_text = 6;
    // input_number asks for a number from number_min to number_max.
    bool input_number = 7;
    // close shows a Close button. Its answer closes the window.
    bool close = 8;
    // end closes the window at once: the conversation ended without a
    // Close button, such as after a timeout.
    bool end = 9;
  }
  uint32 text_max = 10;
  int64 number_min = 11;
  int64 number_max = 12;
}

message NpcMenu {
  repeated string options = 1;
}

// NpcImage shows an NPC illustration, as rAthena's cutin. The asset is
// image/illust/<name>. An empty name hides the image. The client also
// hides it when the dialog window closes.
message NpcImage {
  string name = 1;
  ImagePosition position = 2;
}

enum ImagePosition {
  IMAGE_POSITION_UNSPECIFIED = 0;
  IMAGE_POSITION_LEFT = 1;
  IMAGE_POSITION_CENTER = 2;
  IMAGE_POSITION_RIGHT = 3;
}

// NpcProgress shows a progress bar over the player for duration_ms, as
// rAthena's progressbar. The conversation goes on when it is full. A
// walk command cancels it, and ends the conversation.
message NpcProgress {
  uint32 duration_ms = 1;
  // color is 0xRRGGBB.
  uint32 color = 2;
}

// NpcProgressBar shows a progress bar over an NPC for duration_ms, as
// rAthena's progressbar_npc. A player who comes into view while it runs
// gets the time left.
message NpcProgressBar {
  uint32 npc = 1;
  uint32 duration_ms = 2;
  // color is 0xRRGGBB.
  uint32 color = 3;
}

// Emotion shows an emotion icon over an entity, as rAthena's emotion.
// emotion is an ET_ value, from 0, which is the action of the client's
// emotion sprite.
message Emotion {
  uint32 entity = 1;
  uint32 emotion = 2;
}

// MinimapMark marks a cell on the player's minimap, as rAthena's
// viewpoint. A mark with the same id replaces the last one. remove
// takes the mark away. Marks end with a map change.
message MinimapMark {
  uint32 id = 1;
  uint32 x = 2;
  uint32 y = 3;
  // color is 0xRRGGBB.
  uint32 color = 4;
  bool remove = 5;
}

// ShopOpen opens a shop window: what the NPC sells, with the prices
// for this player after Discount, and the inventory slots the player
// may sell, with the prices after Overcharge. A shop of data/npcs.yml
// may cost items and currencies beside zeny, and may limit its stock
// (proposal 0002, review decision 30).
message ShopOpen {
  uint32 npc = 1;
  repeated ShopItem items = 2;
  // sellable is empty for a shop that does not buy from players.
  repeated ShopSellable sellable = 3;
  // name is the shop's display name.
  string name = 4;
  // buys_from_players is set for a shop with a sell tab.
  bool buys_from_players = 5;
}

message ShopItem {
  uint32 item_id = 1;
  // price is in zeny, for one.
  uint32 price = 2;
  // weight is the weight of one, in tenths, for the window's weight
  // check.
  uint32 weight = 3;
  // cost_items and cost_currencies are the rest of the cost of one.
  repeated ShopCostItem cost_items = 4;
  repeated ShopCostCurrency cost_currencies = 5;
  // stock is how many are left for every player, when the shop limits
  // the item.
  optional uint32 stock = 6;
}

// ShopCostItem is an item a purchase takes, for one bought.
message ShopCostItem {
  uint32 item_id = 1;
  uint32 amount = 2;
}

// ShopCostCurrency is a currency a purchase takes, for one bought.
message ShopCostCurrency {
  // currency is the record's full name, such as cash or
  // example.arena:tokens.
  string currency = 1;
  string display_name = 2;
  uint32 amount = 3;
}

message ShopSellable {
  uint32 slot = 1;
  uint32 price = 2;
}

// ShopResult answers ShopBuy, ShopSell or ShopClose. The shop window
// closes after it. Inventory and zeny changes come as their own events.
message ShopResult {
  ShopOutcome outcome = 1;
  // item_id is the item an outcome is about, such as the one out of
  // stock.
  uint32 item_id = 2;
}

enum ShopOutcome {
  SHOP_OUTCOME_UNSPECIFIED = 0;
  SHOP_OUTCOME_BOUGHT = 1;
  SHOP_OUTCOME_SOLD = 2;
  // The player has too little zeny for the purchase.
  SHOP_OUTCOME_NOT_ENOUGH_ZENY = 3;
  // The items would pass the player's maximum weight, or a stack would
  // pass its limit.
  SHOP_OUTCOME_OVERWEIGHT = 4;
  // The inventory has too few free slots, or the list was not valid.
  SHOP_OUTCOME_FAILED = 5;
  SHOP_OUTCOME_CLOSED = 6;
  // NOT_ENOUGH_ITEMS: the player lacks the items the cost takes
  // (PURCHASE_FAIL_GOODS).
  SHOP_OUTCOME_NOT_ENOUGH_ITEMS = 7;
  // NOT_ENOUGH_CURRENCY: the player lacks a currency the cost takes.
  SHOP_OUTCOME_NOT_ENOUGH_CURRENCY = 8;
  // OUT_OF_STOCK: the shop has fewer left than the purchase asks
  // (PURCHASE_FAIL_STOCK_EMPTY).
  SHOP_OUTCOME_OUT_OF_STOCK = 9;
}

message EffectPlay {
  uint32 effect_id = 1;
  oneof at {
    uint32 entity = 2;
    Cell cell = 3;
  }
}

// EffectRemove stops an effect that plays on an entity, as rAthena's
// removespecialeffect.
message EffectRemove {
  uint32 entity = 1;
  uint32 effect_id = 2;
}

// SoundPlay plays a sound, as rAthena's soundeffect and soundeffectall.
// name is a sound asset, such as sound/effect/ef_hit1. entity is the
// entity it comes from, which places it, or 0 for the player itself.
message SoundPlay {
  string name = 1;
  // repeat plays it again and again, as type 1.
  bool repeat = 2;
  uint32 entity = 3;
}

// MusicPlay changes the background music, as rAthena's playBGM. name is
// a music asset, such as music/08. The map's own music comes back with
// the next map change.
message MusicPlay {
  string name = 1;
}

// DigitsShow shows a digital clock at the top of the screen, as rAthena's
// showdigit (clif_showdigit).
message DigitsShow {
  DigitsKind kind = 1;
  // value is in seconds, as clif_showdigit sends it: COUNT_UP and
  // COUNT_DOWN start at -value, so their value is 0 or less.
  sint32 value = 2;
}

// DigitsKind is showdigit's type.
enum DigitsKind {
  // UNSPECIFIED shows value for 5 seconds (type 0).
  DIGITS_KIND_UNSPECIFIED = 0;
  // COUNT_UP counts up from -value, once a second (type 1).
  DIGITS_KIND_COUNT_UP = 1;
  // COUNT_DOWN counts down from -value, once a second, past 0 (type 2).
  DIGITS_KIND_COUNT_DOWN = 2;
  // COUNT_DOWN_TO_ZERO counts down from value, at most 99, and stops at
  // 0 (type 3).
  DIGITS_KIND_COUNT_DOWN_TO_ZERO = 3;
}

// ItemTaken shows an entity picking up a ground item.
message ItemTaken {
  uint32 source = 1;
  uint32 item = 2;
}

// InventoryUpdate is the player's whole inventory. It replaces what the
// client had. The first frame carries it.
message InventoryUpdate {
  // items lists the slots that hold an item.
  repeated InventoryItem items = 1;
  // size is how many slots take new items, as rAthena's inventory_slots.
  uint32 size = 2;
  // more is set when items is a page of a long inventory. The pages
  // after the first come in later frames with more set, and add their
  // slots to the list instead of replacing it. Only the first page
  // replaces the list.
  bool more = 3;
}

// InventoryItem is one inventory slot.
message InventoryItem {
  // slot is the slot's index, from 0, as rAthena's inventory index.
  uint32 slot = 1;
  uint32 item_id = 2;
  uint32 amount = 3;
  // equip holds the positions the item is equipped in, as rAthena's EQP_
  // bits, or 0.
  uint32 equip = 4;
  uint32 refine = 5;
  // cards are the card IDs in the item's slots, in slot order. Only filled
  // slots are listed.
  repeated uint32 cards = 6;
  // location holds the positions the item can be worn in, as rAthena's
  // EQP_ bits, or 0 for an item that is not worn. For a card, it holds
  // the positions of the items it can go into.
  uint32 location = 7;
  // card is set for a card, which InsertCard puts into an item.
  bool card = 8;
  // rolls are the copy's rolled values, card_rolls the rolls of each
  // card in the order of cards, and options its random options (strategy
  // section 5.4).
  repeated ItemRoll rolls = 9;
  repeated CardRolls card_rolls = 10;
  repeated ItemOption options = 11;
  // bound is who the copy is bound to, as rAthena's bound_type. A bound
  // copy cannot be traded or dropped, and goes only into storage its
  // owner shares.
  ItemBound bound = 12;
  // restrictions are the item's restrictions, as the bits of
  // ItemRestriction, from rAthena's item_trade.
  uint32 restrictions = 13;
}

// ItemBound is rAthena's bound_type.
enum ItemBound {
  // UNSPECIFIED: the copy is not bound.
  ITEM_BOUND_UNSPECIFIED = 0;
  ITEM_BOUND_ACCOUNT = 1;
  ITEM_BOUND_GUILD = 2;
  ITEM_BOUND_PARTY = 3;
  ITEM_BOUND_CHARACTER = 4;
}

// ItemRestriction are the bits of InventoryItem.restrictions, from
// rAthena's item_trade flags.
enum ItemRestriction {
  ITEM_RESTRICTION_UNSPECIFIED = 0;
  ITEM_RESTRICTION_NO_DROP = 1;
  ITEM_RESTRICTION_NO_TRADE = 2;
  ITEM_RESTRICTION_NO_SELL = 4;
  ITEM_RESTRICTION_NO_CART = 8;
  ITEM_RESTRICTION_NO_STORAGE = 16;
  ITEM_RESTRICTION_NO_GUILD_STORAGE = 32;
  ITEM_RESTRICTION_NO_MAIL = 64;
}

// ItemRoll is one rolled value of an item copy, with its range, as the
// client shows it: "Damage against bosses +31% (15 to 35)".
message ItemRoll {
  // name is the roll's name in the item's data, such as boss_damage.
  string name = 1;
  // label is how the client shows the roll, such as "Damage against
  // bosses".
  string label = 2;
  // value is the rolled value. known is false for a hidden roll of a
  // copy that is not identified yet. value is 0 then.
  sint32 value = 3;
  bool known = 4;
  sint32 min = 5;
  sint32 max = 6;
  // unit is "%" or empty.
  string unit = 7;
}

// CardRolls are the rolls of one card in an item's slots.
message CardRolls {
  repeated ItemRoll rolls = 1;
}

// ItemOption is one random option of an item copy, as rAthena's random
// options.
message ItemOption {
  // name is the option's name in data/random_options.yml, such as max_hp.
  string name = 1;
  // label is how the client shows it, such as "MaxHP".
  string label = 2;
  sint32 value = 3;
  // unit is "%" or empty.
  string unit = 4;
  // flag is set for an option that has no amount, such as an attack
  // element. The client shows its label only.
  bool flag = 5;
}

// ItemRollsChange tells the player the rolls of a slot changed, as when
// a mod rerolls an equipped copy.
message ItemRollsChange {
  uint32 slot = 1;
  repeated ItemRoll rolls = 2;
  repeated CardRolls card_rolls = 3;
  repeated ItemOption options = 4;
}

// InventoryAdd tells the player an amount of an item entered a slot. The
// slot was empty or held the same item.
message InventoryAdd {
  uint32 item_id = 1;
  // amount is the amount added, not the slot's new total.
  uint32 amount = 2;
  uint32 slot = 3;
  // refine and cards are those of an equipment item that was picked up.
  uint32 refine = 4;
  repeated uint32 cards = 5;
  // location and card are as in InventoryItem.
  uint32 location = 6;
  bool card = 7;
  // rolls, card_rolls and options are as in InventoryItem.
  repeated ItemRoll rolls = 8;
  repeated CardRolls card_rolls = 9;
  repeated ItemOption options = 10;
  // bound and restrictions are as in InventoryItem.
  ItemBound bound = 11;
  uint32 restrictions = 12;
}

// InventoryRemove tells the player an amount left a slot. A slot left
// with nothing is empty.
message InventoryRemove {
  uint32 slot = 1;
  uint32 amount = 2;
  InventoryRemoveReason reason = 3;
}

enum InventoryRemoveReason {
  INVENTORY_REMOVE_REASON_UNSPECIFIED = 0;
  // The player used the item.
  INVENTORY_REMOVE_REASON_USED = 1;
  // The player dropped the item on the ground.
  INVENTORY_REMOVE_REASON_DROPPED = 2;
  // A script took the item, as rAthena's delitem.
  INVENTORY_REMOVE_REASON_TAKEN = 3;
  // The player sold the item to a shop.
  INVENTORY_REMOVE_REASON_SOLD = 4;
  // The player put the card into an item.
  INVENTORY_REMOVE_REASON_CARD_INSERTED = 5;
  // The player put the item into a storage.
  INVENTORY_REMOVE_REASON_STORED = 6;
  // A guild skill took the item.
  INVENTORY_REMOVE_REASON_GUILD = 7;
  // The item went to the other player of a trade.
  INVENTORY_REMOVE_REASON_TRADED = 8;
  // A bound item went away with its bond, such as a party-bound item of
  // a player who left the party.
  INVENTORY_REMOVE_REASON_BOUND = 9;
  // The item went into a mail.
  INVENTORY_REMOVE_REASON_MAILED = 10;
  // The item went to a buying store.
  INVENTORY_REMOVE_REASON_SOLD_TO_STORE = 11;
  // A shop took the item as part of a purchase's cost.
  INVENTORY_REMOVE_REASON_PAID = 12;
}

// ItemUsed shows an entity using an item, as rAthena's clif_useitemack
// to the area. The user gets it too.
message ItemUsed {
  uint32 source = 1;
  uint32 item_id = 2;
}

// UseItemFailed tells the player why a UseItem did nothing.
message UseItemFailed {
  uint32 slot = 1;
  UseItemFailure reason = 2;
}

enum UseItemFailure {
  USE_ITEM_FAILURE_UNSPECIFIED = 0;
  // The slot holds nothing.
  USE_ITEM_FAILURE_EMPTY_SLOT = 1;
  // The item is not a healing, usable or cash item.
  USE_ITEM_FAILURE_NOT_USABLE = 2;
  // The item's script needs a feature the server does not have yet. A
  // system chat line says which, when the server knows.
  USE_ITEM_FAILURE_NOT_SUPPORTED = 3;
  // The last item use was less than item_use_interval ago.
  USE_ITEM_FAILURE_TOO_SOON = 4;
  // The item's reuse delay has not ended.
  USE_ITEM_FAILURE_COOLDOWN = 5;
  // The player's level, sex or job may not use the item.
  USE_ITEM_FAILURE_CANNOT_USE = 6;
  // A cash item needs a weight below open_box_weight_rate.
  USE_ITEM_FAILURE_OVERWEIGHT = 7;
  // A cash item needs more than 10 empty slots.
  USE_ITEM_FAILURE_INVENTORY_FULL = 8;
}

// DropItemFailed tells the player why a DropItem did nothing.
message DropItemFailed {
  uint32 slot = 1;
  DropItemFailure reason = 2;
}

enum DropItemFailure {
  DROP_ITEM_FAILURE_UNSPECIFIED = 0;
  // The slot holds nothing.
  DROP_ITEM_FAILURE_EMPTY_SLOT = 1;
  // The amount is 0 or more than the slot holds.
  DROP_ITEM_FAILURE_BAD_AMOUNT = 2;
  // The item may not be dropped: its no_drop restriction.
  DROP_ITEM_FAILURE_CANNOT_DROP = 3;
  // The copy is bound, and bound items cannot be dropped.
  DROP_ITEM_FAILURE_BOUND = 4;
  // The player dropped too many items too fast, or too many of its
  // items, or of the map's, lie on the ground (review 2026-10).
  DROP_ITEM_FAILURE_TOO_MANY = 5;
}

// PickUpFailed tells the player why a PickUp did nothing.
message PickUpFailed {
  uint32 item = 1;
  PickUpFailure reason = 2;
}

enum PickUpFailure {
  PICK_UP_FAILURE_UNSPECIFIED = 0;
  // The item is gone or out of sight.
  PICK_UP_FAILURE_GONE = 1;
  // Another player has the right to it for now.
  PICK_UP_FAILURE_NOT_YOURS = 2;
  // The item would pass the player's maximum weight.
  PICK_UP_FAILURE_OVERWEIGHT = 3;
  // The inventory has no free slot.
  PICK_UP_FAILURE_INVENTORY_FULL = 4;
  // The player's stack of the item would pass 30000 or its stack limit.
  PICK_UP_FAILURE_TOO_MANY = 5;
}

// ItemEquipped tells the player an item went on. position holds the
// positions it now takes, as rAthena's EQP_ bits. Items that were there
// come off first, each with ItemUnequipped.
message ItemEquipped {
  uint32 slot = 1;
  uint32 position = 2;
}

// ItemUnequipped tells the player an item came off. position holds the
// positions it took.
message ItemUnequipped {
  uint32 slot = 1;
  uint32 position = 2;
}

// EquipFailed tells the player why an EquipItem did nothing, as rAthena's
// clif_equipitemack.
message EquipFailed {
  uint32 slot = 1;
  EquipFailure reason = 2;
}

enum EquipFailure {
  EQUIP_FAILURE_UNSPECIFIED = 0;
  // The slot holds nothing.
  EQUIP_FAILURE_EMPTY_SLOT = 1;
  // The player's job, class or sex may not wear the item, the item does
  // not go in the asked position, or it is already worn
  // (ITEM_EQUIP_ACK_FAIL).
  EQUIP_FAILURE_CANNOT_EQUIP = 2;
  // The player's base level is outside the item's range
  // (ITEM_EQUIP_ACK_FAILLEVEL).
  EQUIP_FAILURE_LEVEL = 3;
  // Ammunition that does not fit the player's weapon.
  EQUIP_FAILURE_WRONG_AMMUNITION = 4;
}

// CardInserted tells the player a card went into an item. The card slot
// loses one card with INVENTORY_REMOVE_REASON_CARD_INSERTED.
message CardInserted {
  uint32 card_slot = 1;
  uint32 equip_slot = 2;
  uint32 card_id = 3;
}

// InsertCardFailed tells the player an InsertCard did nothing, as
// clif_insert_card with its failure flag.
message InsertCardFailed {
  uint32 card_slot = 1;
  uint32 equip_slot = 2;
}

// LookChange tells the players who see an entity that its look changed,
// such as a player who put on a weapon or a hat, as clif_changelook.
message LookChange {
  uint32 id = 1;
  Look look = 2;
}

// StatusIcon shows or hides one of the player's status icons, as
// clif_status_change. Only the player gets its own icons.
message StatusIcon {
  // icon is the EFST_ ID of the client's status icon table.
  uint32 icon = 1;
  // on is true when the icon shows, and false when it goes.
  bool on = 2;
  // remaining_ms is how long the status lasts, or -1 when it does not
  // end by itself. It is 0 when the icon goes.
  int64 remaining_ms = 3;
  // values are up to three numbers the icon may show, such as a level.
  repeated int32 values = 4;
}

// Options are what an entity's status changes show to everyone who sees
// it, as rAthena's opt1, opt2, opt3 and option. The client draws them,
// such as stone, frozen, stun stars, poison or hiding.
message Options {
  // body is opt1: one state of the body, such as 1 stone, 2 frozen,
  // 3 stunned or 4 asleep (OPT1_).
  uint32 body = 1;
  // health is opt2: bits such as 1 poison, 2 curse, 4 silence and
  // 16 blind (OPT2_).
  uint32 health = 2;
  // effect is opt3: bits of visual effects (OPT3_).
  uint32 effect = 3;
  // option is the option bits, such as 2 hiding and 4 cloaking
  // (OPTION_).
  uint32 option = 4;
}

// OptionChange tells the players who see an entity that its status
// options changed, as clif_changeoption.
message OptionChange {
  uint32 id = 1;
  Options options = 2;
}

// PartyInfo is the player's party: after login, and after every change of
// its members, leader or options. An id of 0 means the player has no
// party, such as after it left.
message PartyInfo {
  uint64 id = 1;
  string name = 2;
  PartyOptions options = 3;
  // members are every member, online or not, in slot order, as
  // clif_party_info. A new member takes the slot of the first member
  // who left.
  repeated PartyMember members = 4;
}

// PartyMember is one member of the player's party.
message PartyMember {
  string name = 1;
  bool leader = 2;
  bool online = 3;
  // map is the member's map's asset name, such as map/prontera. It is
  // the last map for a member who is offline.
  string map = 4;
  // job and base_level are the member's job ID and base level.
  uint32 job = 5;
  uint32 base_level = 6;
  // hp and max_hp are the member's exact HP, as clif_party_hp.
  int64 hp = 7;
  int64 max_hp = 8;
  // x and y are the member's cell, for the minimap, as clif_party_xy.
  uint32 x = 9;
  uint32 y = 10;
}

// PartyMemberUpdate changes one member's values in the party window: HP
// when it changes, the cell once a second, and the map, the level and
// the online state when they change.
message PartyMemberUpdate {
  PartyMember member = 1;
}

// PartyInvite asks the player to join a party, as clif_party_invite. The
// player answers with PartyCommand.reply.
message PartyInvite {
  uint64 party_id = 1;
  string party_name = 2;
  // from is the name of the leader who invites.
  string from = 3;
}

// PartyResult tells the player how a party action went, when it failed,
// and what happened to the party, such as a member who left.
message PartyResult {
  PartyOutcome outcome = 1;
  // name is the player or party the outcome is about.
  string name = 2;
}

enum PartyOutcome {
  PARTY_OUTCOME_UNSPECIFIED = 0;
  // CREATED: the player made a party, as clif_party_created 0.
  PARTY_OUTCOME_CREATED = 1;
  // NAME_TAKEN: a party of that name exists, as clif_party_created 1.
  PARTY_OUTCOME_NAME_TAKEN = 2;
  // ALREADY_IN_PARTY: the player is in a party already, as
  // clif_party_created 2.
  PARTY_OUTCOME_ALREADY_IN_PARTY = 3;
  // BAD_NAME: the name is not allowed by the chat filter.
  PARTY_OUTCOME_BAD_NAME = 4;
  // NOT_LEADER: only the leader may do that (msg 282).
  PARTY_OUTCOME_NOT_LEADER = 5;
  // NOT_ONLINE: no player of that name is online (PARTY_REPLY_OFFLINE).
  PARTY_OUTCOME_NOT_ONLINE = 6;
  // TARGET_IN_PARTY: the player is in a party or has an invite open
  // (PARTY_REPLY_JOIN_OTHER_PARTY).
  PARTY_OUTCOME_TARGET_IN_PARTY = 7;
  // FULL: the party holds the most members it may hold
  // (PARTY_REPLY_FULL).
  PARTY_OUTCOME_FULL = 8;
  // INVITE_SENT: the invite went out.
  PARTY_OUTCOME_INVITE_SENT = 9;
  // REFUSED: the player refused the invite, or blocks the leader
  // (PARTY_REPLY_REJECTED).
  PARTY_OUTCOME_REFUSED = 10;
  // ACCEPTED: the player joined (PARTY_REPLY_ACCEPTED).
  PARTY_OUTCOME_ACCEPTED = 11;
  // SAME_ACCOUNT: a character of the same account is in the party
  // (PARTY_REPLY_DUAL).
  PARTY_OUTCOME_SAME_ACCOUNT = 12;
  // JOINED, LEFT, EXPELLED and DISBANDED tell about members: name joined,
  // left, was expelled, or the party broke up.
  PARTY_OUTCOME_JOINED = 13;
  PARTY_OUTCOME_LEFT = 14;
  PARTY_OUTCOME_EXPELLED = 15;
  PARTY_OUTCOME_DISBANDED = 16;
  // NOT_MEMBER: no member of that name is in the party.
  PARTY_OUTCOME_NOT_MEMBER = 17;
  // LEADER_CHANGED: name is the new leader.
  PARTY_OUTCOME_LEADER_CHANGED = 18;
  // LEADER_NOT_HERE: the new leader must be on the leader's map, as
  // MSI_PARTY_MASTER_CHANGE_SAME_MAP.
  PARTY_OUTCOME_LEADER_NOT_HERE = 19;
  // EXP_SHARE_REFUSED: even exp share needs the online members' base
  // levels within party_share_level, as the char server's party option
  // check. EXP_SHARE_OFF: even exp share was turned off for that reason.
  PARTY_OUTCOME_EXP_SHARE_REFUSED = 20;
  PARTY_OUTCOME_EXP_SHARE_OFF = 21;
  // OPTIONS_CHANGED: the leader changed the options.
  PARTY_OUTCOME_OPTIONS_CHANGED = 22;
  // NO_PARTY: the player has no party.
  PARTY_OUTCOME_NO_PARTY = 23;
}

// FriendList is the player's friend list: after login and after each
// change.
message FriendList {
  repeated Friend friends = 1;
}

message Friend {
  string name = 1;
  bool online = 2;
}

// FriendStatus tells that a friend logged in or out, as
// clif_friendslist_toggle.
message FriendStatus {
  string name = 1;
  bool online = 2;
}

// FriendRequest asks the player to be friends with from, as
// clif_friendlist_req. The player answers with FriendCommand.reply.
message FriendRequest {
  string from = 1;
}

// FriendResult answers a friend action, as clif_friendslist_reqack and
// the friend messages.
message FriendResult {
  FriendOutcome outcome = 1;
  string name = 2;
}

enum FriendOutcome {
  FRIEND_OUTCOME_UNSPECIFIED = 0;
  // ADDED: the player and name are friends now (reqack 0).
  FRIEND_OUTCOME_ADDED = 1;
  // REFUSED: name does not want to be friends (reqack 1).
  FRIEND_OUTCOME_REFUSED = 2;
  // LIST_FULL: the player's list is full (reqack 2).
  FRIEND_OUTCOME_LIST_FULL = 3;
  // THEIR_LIST_FULL: name's list is full (reqack 3).
  FRIEND_OUTCOME_THEIR_LIST_FULL = 4;
  // NOT_ONLINE: no player of that name is online (msg 3).
  FRIEND_OUTCOME_NOT_ONLINE = 5;
  // ALREADY_FRIENDS: name is on the list (msg 671).
  FRIEND_OUTCOME_ALREADY_FRIENDS = 6;
  // REQUEST_SENT: the request went out.
  FRIEND_OUTCOME_REQUEST_SENT = 7;
  // REMOVED: name is off the list (msg 674).
  FRIEND_OUTCOME_REMOVED = 8;
  // NOT_FOUND: name is not on the list (msg 672).
  FRIEND_OUTCOME_NOT_FOUND = 9;
}

// PartyBookingList answers PartyBookingCommand: the ads a search found,
// or the player's own ad after register and delete.
message PartyBookingList {
  repeated PartyBookingEntry entries = 1;
  // more is set when the search found more ads than it lists, as
  // party_booking_search's more_result.
  bool more = 2;
  // registered is set when the player has an ad. own is that ad.
  bool registered = 3;
  PartyBookingEntry own = 4;
  // refused is set when register failed because the player has an ad
  // already, as clif_PartyBookingRegisterAck 2.
  bool refused = 5;
}

message PartyBookingEntry {
  // name is the character that placed the ad.
  string name = 1;
  PartyBookingAd ad = 2;
  // placed_at_ms is when the ad was placed, in Unix milliseconds.
  int64 placed_at_ms = 3;
}

// PartyItemShared tells the party who got an item that even item share
// gave, as clif_party_show_picker.
message PartyItemShared {
  // name is the member who got the item.
  string name = 1;
  uint32 item_id = 2;
  uint32 amount = 3;
}

// GuildInfo is the player's guild: after login, and after every change
// of its members, positions, notice, skills, relations, level or emblem.
// An id of 0 means the player has no guild, such as after it left.
message GuildInfo {
  uint64 id = 1;
  string name = 2;
  // level is 1 to 50. exp is the exp toward the next level, and next_exp
  // what the next level needs, or 0 at the top, as guild_calcinfo.
  uint32 level = 3;
  int64 exp = 4;
  int64 next_exp = 5;
  uint32 skill_points = 6;
  // max_members is guild_members plus 6 per level of Guild Extension.
  uint32 max_members = 7;
  // master is the master's name.
  string master = 8;
  GuildNotice notice = 9;
  // emblem_version is 0 without an emblem, as GuildBadge.
  uint32 emblem_version = 10;
  // members are every member, online or not, in slot order, as
  // clif_guild_memberlist. The master is first.
  repeated GuildMember members = 11;
  repeated GuildPosition positions = 12;
  repeated GuildRelation relations = 13;
  // skills are the guild skills of the world's tree, in skill ID order.
  repeated GuildSkill skills = 14;
  // position is the player's own position index.
  uint32 position = 15;
  // average_level is the members' average base level.
  uint32 average_level = 16;
}

// GuildMember is one member of the player's guild.
message GuildMember {
  string name = 1;
  // position is the member's position index.
  uint32 position = 2;
  bool online = 3;
  // map is the member's map's asset name, the last one for a member who
  // is offline.
  string map = 4;
  uint32 job = 5;
  uint32 base_level = 6;
  // exp is the exp the member gave the guild through the exp tax.
  int64 exp = 7;
  // x and y are the member's cell, for the minimap, as clif_guild_xy.
  // Members on the player's map get them every 5 seconds.
  uint32 x = 8;
  uint32 y = 9;
  bool master = 10;
}

// GuildMemberUpdate changes one member's values in the guild window: the
// online state, map, level, job, exp and cell.
message GuildMemberUpdate {
  GuildMember member = 1;
}

// GuildRelation is an allied or enemy guild.
message GuildRelation {
  uint64 guild_id = 1;
  string name = 2;
  bool enemy = 3;
}

// GuildSkill is one guild skill and its level.
message GuildSkill {
  uint32 skill_id = 1;
  uint32 level = 2;
  // max_level is the tree's maximum level.
  uint32 max_level = 3;
  // can_raise is set when the master may raise the skill now: the guild
  // has a skill point and the skill's requirements are met.
  bool can_raise = 4;
}

// GuildInvite asks the player to join a guild, as clif_guild_invite. The
// player answers with GuildCommand.reply.
message GuildInvite {
  uint64 guild_id = 1;
  string guild_name = 2;
  string from = 3;
}

// GuildAllyRequest asks the player's guild to be allies with another, as
// clif_guild_reqalliance. The player answers with
// GuildCommand.ally_reply.
message GuildAllyRequest {
  uint64 guild_id = 1;
  string guild_name = 2;
  string from = 3;
}

// GuildResult tells the player how a guild action went, and what happened
// to the guild, such as a member who left.
message GuildResult {
  GuildOutcome outcome = 1;
  // name is the player or guild the outcome is about.
  string name = 2;
}

enum GuildOutcome {
  GUILD_OUTCOME_UNSPECIFIED = 0;
  // CREATED: the player made a guild, as clif_guild_created 0.
  GUILD_OUTCOME_CREATED = 1;
  // ALREADY_IN_GUILD: the player is in a guild, as clif_guild_created 1.
  GUILD_OUTCOME_ALREADY_IN_GUILD = 2;
  // NAME_TAKEN: a guild of that name exists, as clif_guild_created 2.
  GUILD_OUTCOME_NAME_TAKEN = 3;
  // NO_EMPERIUM: making a guild takes an Emperium, as
  // clif_guild_created 3.
  GUILD_OUTCOME_NO_EMPERIUM = 4;
  // BAD_NAME: the chat filter does not allow the name.
  GUILD_OUTCOME_BAD_NAME = 5;
  // NO_GUILD: the player has no guild.
  GUILD_OUTCOME_NO_GUILD = 6;
  // NO_PERMISSION: the player's position does not allow it.
  GUILD_OUTCOME_NO_PERMISSION = 7;
  // NOT_MASTER: only the guild master may do it.
  GUILD_OUTCOME_NOT_MASTER = 8;
  // NOT_ONLINE: no player of that name is online (clif_guild_inviteack
  // 1).
  GUILD_OUTCOME_NOT_ONLINE = 9;
  // TARGET_IN_GUILD: the player is in a guild or has an invite open
  // (clif_guild_inviteack 0).
  GUILD_OUTCOME_TARGET_IN_GUILD = 10;
  // FULL: the guild holds the most members it may hold
  // (clif_guild_inviteack 3).
  GUILD_OUTCOME_FULL = 11;
  // INVITE_SENT: the invite went out.
  GUILD_OUTCOME_INVITE_SENT = 12;
  // REFUSED: the player refused the invite, or blocks the inviter
  // (clif_guild_inviteack 1).
  GUILD_OUTCOME_REFUSED = 13;
  // ACCEPTED: the player joined (clif_guild_inviteack 2).
  GUILD_OUTCOME_ACCEPTED = 14;
  // JOINED, LEFT, EXPELLED and DISBANDED tell about members: name joined,
  // left, was expelled, or the guild broke up.
  GUILD_OUTCOME_JOINED = 15;
  GUILD_OUTCOME_LEFT = 16;
  GUILD_OUTCOME_EXPELLED = 17;
  GUILD_OUTCOME_DISBANDED = 18;
  // NOT_MEMBER: no member of that name is in the guild.
  GUILD_OUTCOME_NOT_MEMBER = 19;
  // MASTER_CANNOT_LEAVE: the master must hand the guild over or break
  // it up.
  GUILD_OUTCOME_MASTER_CANNOT_LEAVE = 20;
  // MASTER_CHANGED: name is the new master (msg 679).
  GUILD_OUTCOME_MASTER_CHANGED = 21;
  // MASTER_CHANGE_TOO_SOON: guild_leaderchange_delay has not passed
  // (MSI_IMPOSSIBLE_CHANGE_GUILD_MASTER_NOT_TIME).
  GUILD_OUTCOME_MASTER_CHANGE_TOO_SOON = 22;
  // POSITIONS_CHANGED: the master changed the positions.
  GUILD_OUTCOME_POSITIONS_CHANGED = 23;
  // NOTICE_CHANGED: the master changed the notice.
  GUILD_OUTCOME_NOTICE_CHANGED = 24;
  // SKILL_RAISED: name is the skill the master raised.
  GUILD_OUTCOME_SKILL_RAISED = 25;
  // SKILL_REFUSED: the skill cannot be raised: no point, its maximum, or
  // a requirement is missing.
  GUILD_OUTCOME_SKILL_REFUSED = 26;
  // LEVEL_UP: the guild reached a new level.
  GUILD_OUTCOME_LEVEL_UP = 27;
  // ALLY_REQUEST_SENT: the alliance request went out.
  GUILD_OUTCOME_ALLY_REQUEST_SENT = 28;
  // ALLIED: the guilds are allies now (clif_guild_allianceack 2).
  GUILD_OUTCOME_ALLIED = 29;
  // ALLY_REFUSED: the other guild refused (clif_guild_allianceack 3).
  GUILD_OUTCOME_ALLY_REFUSED = 30;
  // ALLY_LIMIT: the player's guild has the most allies
  // (clif_guild_allianceack 4).
  GUILD_OUTCOME_ALLY_LIMIT = 31;
  // THEIR_ALLY_LIMIT: the other guild has the most allies
  // (clif_guild_allianceack 3).
  GUILD_OUTCOME_THEIR_ALLY_LIMIT = 32;
  // ALREADY_ALLIED: the guilds are allies already
  // (clif_guild_allianceack 0).
  GUILD_OUTCOME_ALREADY_ALLIED = 33;
  // TARGET_BUSY: the player has a request open (clif_guild_allianceack
  // 1).
  GUILD_OUTCOME_TARGET_BUSY = 34;
  // TARGET_NOT_MASTER: with guild_alliance_onlygm, the player must be a
  // master (clif_guild_allianceack 5).
  GUILD_OUTCOME_TARGET_NOT_MASTER = 35;
  // ENEMY_ADDED: name is an enemy guild now (clif_guild_oppositionack
  // 0).
  GUILD_OUTCOME_ENEMY_ADDED = 36;
  // ENEMY_LIMIT: the guild has the most enemies
  // (clif_guild_oppositionack 1).
  GUILD_OUTCOME_ENEMY_LIMIT = 37;
  // ALREADY_ENEMY: name is an enemy guild already
  // (clif_guild_oppositionack 2).
  GUILD_OUTCOME_ALREADY_ENEMY = 38;
  // RELATION_ENDED: the alliance or enemy relation with name ended.
  GUILD_OUTCOME_RELATION_ENDED = 39;
  // SAME_GUILD: the player is in the player's own guild.
  GUILD_OUTCOME_SAME_GUILD = 40;
  // NOT_EMPTY: the guild breaks up only when the master is its only
  // member (clif_guild_broken 2).
  GUILD_OUTCOME_NOT_EMPTY = 41;
  // EMBLEM_CHANGED: the guild has a new emblem.
  GUILD_OUTCOME_EMBLEM_CHANGED = 42;
  // POSITION_CHANGED: name got a new position.
  GUILD_OUTCOME_POSITION_CHANGED = 43;
}

// StorageKind is the storage a storage event is about.
enum StorageKind {
  STORAGE_KIND_UNSPECIFIED = 0;
  STORAGE_KIND_GUILD = 1;
  // PERSONAL is the account's storage, or an extra storage of
  // data/storages.yml, named by StorageOpen.name.
  STORAGE_KIND_PERSONAL = 2;
  STORAGE_KIND_CART = 3;
}

// StorageOpen opens the storage window, as clif_storagelist and
// clif_updatestorageamount. For the cart, it comes at login and when the
// player gets a cart, as clif_cartlist. items holds the first page of
// the slots that hold items. StorageItems carries the rest, in later
// frames, so no message passes the 64 KiB limit.
message StorageOpen {
  StorageKind kind = 1;
  // size is how many slots hold items.
  uint32 size = 2;
  repeated InventoryItem items = 3;
  // name is the extra storage's record name, empty for the account's
  // storage, the guild storage and the cart.
  string name = 4;
  // display_name is the storage's name as players see it.
  string display_name = 5;
  // weight and max_weight are the cart's weight and its limit, in
  // tenths, as clif_updatestatus(SP_CARTINFO). They are 0 for storage.
  uint32 weight = 6;
  uint32 max_weight = 7;
  // pages is how many StorageItems follow.
  uint32 pages = 8;
}

// StorageItems is a page of a storage's slots after StorageOpen. The
// pages are what the storage held when it opened, and come in the frames
// right after StorageOpen's, before any StorageAdd or StorageRemove of
// that storage.
message StorageItems {
  StorageKind kind = 1;
  repeated InventoryItem items = 2;
  // page counts from 1. The last page has page equal to StorageOpen.pages.
  uint32 page = 3;
}

// StorageAdd tells an amount entered a storage slot, as
// clif_storageitemadded and clif_cart_additem. item is the slot after
// the change.
message StorageAdd {
  StorageKind kind = 1;
  InventoryItem item = 2;
  uint32 amount = 3;
  // weight is the cart's weight after the change, in tenths. It is 0
  // for storage.
  uint32 weight = 4;
}

// StorageRemove tells an amount left a storage slot, as
// clif_storageitemremoved and clif_cart_delitem. A slot left with
// nothing is empty.
message StorageRemove {
  StorageKind kind = 1;
  uint32 slot = 2;
  uint32 amount = 3;
  // weight is the cart's weight after the change, in tenths. It is 0
  // for storage.
  uint32 weight = 4;
}

// StorageClose closes the storage window, as clif_storageclose. For the
// cart, it comes when the player loses the cart.
message StorageClose {
  StorageKind kind = 1;
}

// StorageResult tells why a storage or cart action failed.
message StorageResult {
  StorageOutcome outcome = 1;
}

enum StorageOutcome {
  STORAGE_OUTCOME_UNSPECIFIED = 0;
  // IN_USE: another member has the guild storage open
  // (GSTORAGE_ALREADY_OPEN).
  STORAGE_OUTCOME_IN_USE = 1;
  // NO_GUILD: the player has no guild (GSTORAGE_NO_GUILD).
  STORAGE_OUTCOME_NO_GUILD = 2;
  // NO_STORAGE: the guild has not learned Guild Storage
  // (GSTORAGE_NO_STORAGE).
  STORAGE_OUTCOME_NO_STORAGE = 3;
  // NO_PERMISSION: the player's position does not allow storage
  // (GSTORAGE_NO_PERMISSION).
  STORAGE_OUTCOME_NO_PERMISSION = 4;
  // ALREADY_OPEN: the player has a storage open
  // (GSTORAGE_STORAGE_ALREADY_OPEN).
  STORAGE_OUTCOME_ALREADY_OPEN = 5;
  // FULL: the storage has no free slot or the stack would pass its limit.
  STORAGE_OUTCOME_FULL = 6;
  // NOT_STORABLE: the item cannot go there, such as an equipped item.
  STORAGE_OUTCOME_NOT_STORABLE = 7;
  // CANNOT_CARRY: the inventory cannot take the item: no slot, or too
  // heavy.
  STORAGE_OUTCOME_CANNOT_CARRY = 8;
  // RESTRICTED: the item's no_storage, no_guild_storage or no_cart
  // restriction keeps it out (itemdb_canstore and the others).
  STORAGE_OUTCOME_RESTRICTED = 9;
  // BOUND: the copy is bound, and the storage is not one its owner
  // shares.
  STORAGE_OUTCOME_BOUND = 10;
  // CART_OVERWEIGHT: the cart cannot take the weight.
  STORAGE_OUTCOME_CART_OVERWEIGHT = 11;
  // NO_CART: the player has no cart.
  STORAGE_OUTCOME_NO_CART = 12;
  // BUSY: the player is trading, or talking to an NPC that did not open
  // the storage.
  STORAGE_OUTCOME_BUSY = 13;
}

// GuildStorageLog answers StorageCommand.log: the guild storage's last
// moves, newest first, as storage_guild_log_read.
message GuildStorageLog {
  repeated GuildStorageLogEntry entries = 1;
}

message GuildStorageLogEntry {
  int64 at_ms = 1;
  // name is the member who moved the item.
  string name = 2;
  uint32 item_id = 3;
  // amount is positive for an item put in, negative for one taken out.
  int32 amount = 4;
  uint32 refine = 5;
  repeated uint32 cards = 6;
}

// TradeRequest asks the player to trade, as clif_traderequest. The
// player answers with TradeCommand.respond.
message TradeRequest {
  // from is the name of the player who asks.
  string from = 1;
  uint32 base_level = 2;
}

// TradeOpen opens the trade window for both players, as
// clif_tradestart(TRADE_ACK_OK).
message TradeOpen {
  // partner is the other player's name and base_level its level.
  string partner = 1;
  uint32 base_level = 2;
}

// TradeOffer shows an item or zeny that a player offered, as
// clif_tradeadditem and clif_tradeitemok. The player who offered gets it
// with mine set, and the other player without it.
message TradeOffer {
  bool mine = 1;
  oneof offer {
    // item is the offered copy. Its slot is the inventory slot it comes
    // from, for mine, and the order of the partner's offers otherwise.
    // Its amount is what this offer adds: offering a slot again adds to
    // the amount of that slot.
    InventoryItem item = 2;
    uint32 zeny = 3;
  }
}

// TradeLock tells a player locked its offer, as clif_tradedeal_lock.
message TradeLock {
  bool mine = 1;
}

// TradeClose closes the trade window, as clif_tradecancelled and
// clif_tradecompleted.
message TradeClose {
  TradeOutcome outcome = 1;
}

// TradeResult tells how a trade step went, when it failed, as
// clif_tradestart's codes and clif_tradeitemok's.
message TradeResult {
  TradeOutcome outcome = 1;
  // name is the player the outcome is about.
  string name = 2;
  // slot is the inventory slot of a refused offer.
  uint32 slot = 3;
  // message is a mod's reason from the trade hook.
  string message = 4;
}

enum TradeOutcome {
  TRADE_OUTCOME_UNSPECIFIED = 0;
  // TOO_FAR: the other player is too far away (TRADE_ACK_TOOFAR).
  TRADE_OUTCOME_TOO_FAR = 1;
  // NOT_FOUND: no such player in sight (TRADE_ACK_CHARNOTEXIST).
  TRADE_OUTCOME_NOT_FOUND = 2;
  // BUSY: the other player is trading or busy (TRADE_ACK_BUSY).
  TRADE_OUTCOME_BUSY = 3;
  // REFUSED: the other player said no, or blocks the player
  // (TRADE_ACK_CANCEL).
  TRADE_OUTCOME_REFUSED = 4;
  // CANCELLED: a player cancelled, moved away or left.
  TRADE_OUTCOME_CANCELLED = 5;
  // COMPLETED: the items and zeny changed hands.
  TRADE_OUTCOME_COMPLETED = 6;
  // FAILED: a check at the end failed, such as weight or a free slot;
  // nothing changed hands.
  TRADE_OUTCOME_FAILED = 7;
  // OVERWEIGHT: the partner cannot carry the offer (TRADE_ITEM_OVERWEIGHT).
  TRADE_OUTCOME_OVERWEIGHT = 8;
  // RESTRICTED: the item cannot be traded: no_trade
  // (TRADE_ITEM_CANNOT_TRADE).
  TRADE_OUTCOME_RESTRICTED = 9;
  // BOUND: the copy is bound (msg 293).
  TRADE_OUTCOME_BOUND = 10;
  // TOO_MANY: the offer has its 10 items, or the partner has no free
  // slot for another.
  TRADE_OUTCOME_TOO_MANY = 11;
  // LOCKED: the offer is locked.
  TRADE_OUTCOME_LOCKED = 12;
  // ZENY: not that much zeny, or the partner would pass the zeny cap.
  TRADE_OUTCOME_ZENY = 13;
  // HOOK: a mod's trade hook refused the trade; message says why.
  TRADE_OUTCOME_HOOK = 14;
  // WAITING: the player confirmed, and waits for the partner.
  TRADE_OUTCOME_WAITING = 15;
  // EQUIPPED: an equipped item cannot be offered.
  TRADE_OUTCOME_EQUIPPED = 16;
  // REQUEST_SENT: the request reached the other player.
  TRADE_OUTCOME_REQUEST_SENT = 17;
}

// CurrencyUpdate lists the player's currencies of data/currencies.yml
// that are above 0, with their amounts. It comes at login and after each
// change, and replaces the list the client had.
message CurrencyUpdate {
  repeated CurrencyAmount currencies = 1;
}

message CurrencyAmount {
  // name is the record's full name, such as cash or example.arena:tokens.
  string name = 1;
  string display_name = 2;
  uint64 amount = 3;
}

// MailBox lists the player's mails, newest first, as
// clif_Mail_refreshinbox. It opens the mailbox window, and comes again
// after each change while the window is open.
message MailBox {
  repeated MailSummary mails = 1;
  // size is the mailbox limit.
  uint32 size = 2;
  // sent_today is how many mails the player sent today, and daily the
  // most per day, or 0 for no limit, as mail_daily_count.
  uint32 sent_today = 3;
  uint32 daily = 4;
}

message MailSummary {
  uint64 id = 1;
  // from is the sender's name: a character, or the name a script gave.
  string from = 2;
  string title = 3;
  int64 sent_ms = 4;
  bool read = 5;
  uint32 zeny = 6;
  // items is how many attachments the mail holds.
  uint32 items = 7;
  // returned is set for a mail that came back to its sender after it
  // expired, as MAIL_INBOX_RETURNED.
  bool returned = 8;
  // expires_ms is when the mail goes back to its sender, or is
  // deleted, as scheduled_deletion. It is 0 when it never expires.
  int64 expires_ms = 9;
}

// MailRead shows one mail, as clif_Mail_read.
message MailRead {
  MailSummary mail = 1;
  string body = 2;
  // items are the attachments. Each slot is the attachment's index.
  repeated InventoryItem items = 3;
}

// MailNew tells the player a mail arrived, as clif_Mail_new.
message MailNew {
  uint64 id = 1;
  string from = 2;
  string title = 3;
  // unread is how many mails the player has not read.
  uint32 unread = 4;
}

// MailResult tells how a mail action went.
message MailResult {
  MailOutcome outcome = 1;
  uint64 mail = 2;
  // message is a mod's reason from the mail hook.
  string message = 3;
}

enum MailOutcome {
  MAIL_OUTCOME_UNSPECIFIED = 0;
  // SENT: the mail went out (WRITE_MAIL_SUCCESS).
  MAIL_OUTCOME_SENT = 1;
  // FAILED: the mail could not be sent, such as a title missing or the
  // attachments changed (WRITE_MAIL_FAILED).
  MAIL_OUTCOME_FAILED = 2;
  // DAILY_LIMIT: the player sent mail_daily_count mails today
  // (WRITE_MAIL_FAILED_CNT).
  MAIL_OUTCOME_DAILY_LIMIT = 3;
  // NO_RECIPIENT: no character has that name.
  MAIL_OUTCOME_NO_RECIPIENT = 4;
  // MAILBOX_FULL: the recipient's mailbox holds its limit.
  MAIL_OUTCOME_MAILBOX_FULL = 5;
  // TOO_FAST: mail_delay has not passed since the last mail (msg 675).
  MAIL_OUTCOME_TOO_FAST = 6;
  // ZENY: too little zeny for the zeny, the fee and the attachment price.
  MAIL_OUTCOME_ZENY = 7;
  // RESTRICTED: an item cannot be mailed: no_mail, equipped or bound
  // (MAIL_ATTACH_UNTRADEABLE).
  MAIL_OUTCOME_RESTRICTED = 8;
  // TOO_MANY: more items than mail_items (MAIL_ATTACH_SPACE).
  MAIL_OUTCOME_TOO_MANY = 9;
  // TOO_HEAVY: the items pass mail_attachment_weight (MAIL_ATTACH_WEIGHT).
  MAIL_OUTCOME_TOO_HEAVY = 10;
  // HOOK: a mod's mail hook refused the mail; message says why.
  MAIL_OUTCOME_HOOK = 11;
  // TAKEN: the attachments moved into the inventory.
  MAIL_OUTCOME_TAKEN = 12;
  // CANNOT_CARRY: the inventory cannot take the items, or the zeny
  // would pass the cap (clif_mail_getattachment's 1 and 2).
  MAIL_OUTCOME_CANNOT_CARRY = 13;
  // DELETED: the mail was deleted.
  MAIL_OUTCOME_DELETED = 14;
  // NOT_EMPTY: a mail with attachments cannot be deleted.
  MAIL_OUTCOME_NOT_EMPTY = 15;
  // BUSY: the player is trading, vending, running a buying store or
  // has a storage open.
  MAIL_OUTCOME_BUSY = 16;
  // NOT_FOUND: the mail is gone, such as one that expired.
  MAIL_OUTCOME_NOT_FOUND = 17;
}

// VendingSetup opens the vending setup window after the Vending skill,
// as clif_openvendingreq.
message VendingSetup {
  // max_items is 2 + the skill's level, as vending_openvending allows.
  uint32 max_items = 1;
}

// VendingOpened shows the player its own open shop, as clif_openvending.
message VendingOpened {
  string title = 1;
  repeated VendingListItem items = 2;
}

// VendingList shows another player's shop, as clif_vendinglist.
message VendingList {
  // vendor is the seller's entity ID, or 0 for a shop a store search
  // opened on another part of the map.
  uint32 vendor = 1;
  // shop is the shop's ID, which VendingBuy repeats.
  uint32 shop = 2;
  string title = 3;
  string seller = 4;
  repeated VendingListItem items = 5;
}

message VendingListItem {
  // index is the line's index, which VendingBuy names.
  uint32 index = 1;
  // item is the copy, with its amount for sale and its cart slot as
  // slot.
  InventoryItem item = 2;
  uint32 price = 3;
}

// VendingSold tells the seller a line sold, as clif_vendingreport.
message VendingSold {
  uint32 index = 1;
  uint32 amount = 2;
  string buyer = 3;
  // zeny is what the seller got, after the tax.
  uint32 zeny = 4;
}

// VendingResult tells how a vending step went.
message VendingResult {
  VendingOutcome outcome = 1;
  uint32 index = 2;
  string message = 3;
}

enum VendingOutcome {
  VENDING_OUTCOME_UNSPECIFIED = 0;
  // OPENED: the shop opened.
  VENDING_OUTCOME_OPENED = 1;
  // BOUGHT: the purchase went through.
  VENDING_OUTCOME_BOUGHT = 2;
  // FAILED: the shop could not open or the purchase failed, such as a
  // line that is not valid.
  VENDING_OUTCOME_FAILED = 3;
  // NOT_ENOUGH_ZENY: PURCHASEMC_NO_ZENY.
  VENDING_OUTCOME_NOT_ENOUGH_ZENY = 4;
  // OVERWEIGHT: PURCHASEMC_OVERWEIGHT, or the inventory has no free slot.
  VENDING_OUTCOME_OVERWEIGHT = 5;
  // OUT_OF_STOCK: PURCHASEMC_OUT_OF_STOCK, or the seller would pass the
  // zeny cap.
  VENDING_OUTCOME_OUT_OF_STOCK = 6;
  // STORE_CHANGED: PURCHASEMC_STORE_INCORRECT: the shop reopened.
  VENDING_OUTCOME_STORE_CHANGED = 7;
  // RESTRICTED: an item cannot be vended (msg 266).
  VENDING_OUTCOME_RESTRICTED = 8;
  // HOOK: a mod's vend hook refused the sale; message says why.
  VENDING_OUTCOME_HOOK = 9;
  // CLOSED: the shop closed.
  VENDING_OUTCOME_CLOSED = 10;
  // TOO_CLOSE: an NPC is within min_npc_vendchat_distance.
  VENDING_OUTCOME_TOO_CLOSE = 11;
}

// EntityShop shows or hides the title of a player's shop over the
// player, as clif_showvendingboard and clif_buyingstore_entry.
message EntityShop {
  uint32 id = 1;
  string title = 2;
  // buying is set for a buying store; a vending shop otherwise.
  bool buying = 3;
  // remove hides it.
  bool remove = 4;
}

// BuyingStoreSetup opens the buying store setup window, as
// clif_buyingstore_open.
message BuyingStoreSetup {
  uint32 slots = 1;
}

// BuyingStoreOpened shows the player its own open store, as
// clif_buyingstore_myitemlist.
message BuyingStoreOpened {
  string title = 1;
  uint32 zeny_limit = 2;
  repeated BuyingStoreItem items = 3;
}

// BuyingStoreList shows another player's store, as
// clif_buyingstore_itemlist.
message BuyingStoreList {
  uint32 buyer = 1;
  uint32 store = 2;
  string title = 3;
  string owner = 4;
  uint32 zeny_limit = 5;
  repeated BuyingStoreItem items = 6;
}

message BuyingStoreItem {
  uint32 item_id = 1;
  uint32 amount = 2;
  uint32 price = 3;
}

// BuyingStoreBought tells the store owner it bought items, as
// clif_buyingstore_update_item.
message BuyingStoreBought {
  uint32 item_id = 1;
  uint32 amount = 2;
  string seller = 3;
  uint32 zeny = 4;
  // zeny_limit is what the store may still spend.
  uint32 zeny_limit = 5;
}

message BuyingStoreResult {
  BuyingStoreOutcome outcome = 1;
  uint32 item_id = 2;
  string message = 3;
}

enum BuyingStoreOutcome {
  BUYING_STORE_OUTCOME_UNSPECIFIED = 0;
  BUYING_STORE_OUTCOME_OPENED = 1;
  // SOLD: the sale went through.
  BUYING_STORE_OUTCOME_SOLD = 2;
  // FAILED: BUYINGSTORE_CREATE or BUYINGSTORE_TRADE_SELLER_FAILED.
  BUYING_STORE_OUTCOME_FAILED = 3;
  // OVERWEIGHT: BUYINGSTORE_CREATE_OVERWEIGHT.
  BUYING_STORE_OUTCOME_OVERWEIGHT = 4;
  // COUNT: BUYINGSTORE_TRADE_SELLER_COUNT: more than the store buys.
  BUYING_STORE_OUTCOME_COUNT = 5;
  // ZENY: BUYINGSTORE_TRADE_SELLER_ZENY: the store lacks the zeny.
  BUYING_STORE_OUTCOME_ZENY = 6;
  // ALL_BOUGHT and LIMIT_REACHED close the owner's store:
  // BUYINGSTORE_TRADE_BUYER_NO_ITEMS and BUYINGSTORE_TRADE_BUYER_ZENY.
  BUYING_STORE_OUTCOME_ALL_BOUGHT = 7;
  BUYING_STORE_OUTCOME_LIMIT_REACHED = 8;
  // HOOK: a mod's buying_store_sale hook refused the sale.
  BUYING_STORE_OUTCOME_HOOK = 9;
  BUYING_STORE_OUTCOME_CLOSED = 10;
}

// StoreSearchOpen opens the store search window, as
// clif_open_search_store_info.
message StoreSearchOpen {
  uint32 uses = 1;
  // open is set when a result's store opens on a click
  // (SEARCHSTORE_EFFECT_REMOTE); a click shows the store's place
  // otherwise.
  bool open = 2;
}

// StoreSearchResults is a page of results, as
// clif_search_store_info_ack.
message StoreSearchResults {
  repeated StoreSearchHit results = 1;
  uint32 uses = 2;
  // more is set when next has another page.
  bool more = 3;
}

message StoreSearchHit {
  // index is what click names.
  uint32 index = 1;
  string title = 2;
  string owner = 3;
  // map is the store's map asset name, such as map/prontera.
  string map = 4;
  uint32 x = 5;
  uint32 y = 6;
  // item is the copy for sale, or the item a buying store wants, with
  // its amount.
  InventoryItem item = 7;
  uint32 price = 8;
  bool buying = 9;
}

message StoreSearchResult {
  StoreSearchOutcome outcome = 1;
  // map, x and y are the store's place for a click that shows it.
  string map = 2;
  uint32 x = 3;
  uint32 y = 4;
}

enum StoreSearchOutcome {
  STORE_SEARCH_OUTCOME_UNSPECIFIED = 0;
  // NOTHING: SSI_FAILED_NOTHING_SEARCH_ITEM.
  STORE_SEARCH_OUTCOME_NOTHING = 1;
  // NO_USES: SSI_FAILED_SEARCH_CNT.
  STORE_SEARCH_OUTCOME_NO_USES = 2;
  // TOO_FAST: SSI_FAILED_LIMIT_SEARCH_TIME, searchstore_querydelay.
  STORE_SEARCH_OUTCOME_TOO_FAST = 3;
  // TOO_MANY: SSI_FAILED_OVER_MAXCOUNT; the results stop at
  // searchstore_maxresults.
  STORE_SEARCH_OUTCOME_TOO_MANY = 4;
  // GONE: SSI_FAILED_SSILIST_CLICK_TO_OPEN_STORE.
  STORE_SEARCH_OUTCOME_GONE = 5;
  // POSITION: the click's store is at map, x and y.
  STORE_SEARCH_OUTCOME_POSITION = 6;
  // OTHER_MAP: the store is on another map, so it cannot open from here.
  STORE_SEARCH_OUTCOME_OTHER_MAP = 7;
}

// WorldEventInfo is a run of a world event (strategy section 8.8,
// proposal 0002, review decision 31).
message WorldEventInfo {
  // name is the event's full name, such as core:Field_Boss.
  string name = 1;
  // display_name is the name players see.
  string display_name = 2;
  // type is "boss", "invasion", "treasure_hunt" or "script".
  string type = 3;
  // map is the asset name of the map where it happens, such as
  // "map/prontera", or empty.
  string map = 4;
  // ends_at_ms is when the run ends, in Unix milliseconds, or 0.
  uint64 ends_at_ms = 5;
}

// WorldEventNotice is a world event's run that started or ended. Every
// player gets it.
message WorldEventNotice {
  WorldEventInfo event = 1;
  // started is set when the run started, and unset when it ended.
  bool started = 2;
  // result is how the run ended: "won", "lost" or "stopped", or empty.
  string result = 3;
}

// WorldEventList is the runs of world events that last now. A player
// gets it at login when there are any.
message WorldEventList {
  repeated WorldEventInfo events = 1;
}

// PlayerLimits are the player's own values of the limits that one player
// holds, which scripts expand (proposal 0002, review decision 32):
// inventory_slots, storage_slots and cart_slots. They come at login and
// after each change. Each value is within the limit's base and max of
// Welcome.limits.ranges. storage_slots is shared by the account's
// characters.
message PlayerLimits {
  repeated PlayerLimit limits = 1;
}

// PlayerLimit is one limit's value for the player.
message PlayerLimit {
  // name is the limit's name, such as inventory_slots.
  string name = 1;
  uint32 value = 2;
}
