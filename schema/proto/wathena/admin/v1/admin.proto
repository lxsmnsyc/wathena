syntax = "proto3";

package wathena.admin.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/lxsmnsyc/wathena/schema/gen/go/wathena/admin/v1;adminv1";

// The admin API's messages (decisions 0028, 0029, 0030 and 0031). The API
// is JSON at /admin/api/v1/, in the protobuf JSON form of these messages,
// with lowerCamelCase field names.

// Me answers GET /me: who the session is and what it may do.
message Me {
  // account is the session's account name.
  string account = 1;
  // role is the role that counts now, or empty. A role counts only when
  // the session logged in with a second factor and the account still
  // has TOTP or a passkey on.
  string role = 2;
  // permissions are the role's permissions.
  repeated string permissions = 3;
  // two_factor is set when the session counts for a role.
  bool two_factor = 4;
  // assigned_role is the account's role whether or not it counts, so
  // the screens can say that two-factor login is missing.
  string assigned_role = 5;
  // recent_login is set when the session logged in, or proved who it
  // is on the reauth page, within 10 minutes. Role changes need it.
  bool recent_login = 6;
  // csrf_token goes in the X-CSRF-Token header of each change.
  string csrf_token = 7;
  // reauth_url is the account page that renews recent_login and comes
  // back to the admin screens.
  string reauth_url = 8;
}

// Role is a configured role and its permissions.
message Role {
  string name = 1;
  repeated string permissions = 2;
}

// StaffMember is one account with a role.
message StaffMember {
  int64 account_id = 1;
  string account = 2;
  string role = 3;
  // from_config is set for the owners of the config's staff.owners.
  // Their role cannot be changed from the admin screens.
  bool from_config = 4;
  // given_by is the account that gave the role, or empty.
  string given_by = 5;
  google.protobuf.Timestamp given_at = 6;
  // two_factor is set when the account has TOTP or a passkey on.
  bool two_factor = 7;
}

// StaffList answers GET /staff.
message StaffList {
  repeated StaffMember members = 1;
  // roles are the roles of the config, which POST /staff gives.
  repeated Role roles = 2;
}

// GiveRoleRequest is the body of POST /staff.
message GiveRoleRequest {
  // account is an account name.
  string account = 1;
  // role is a role of the config. It replaces the account's role.
  string role = 2;
  // reason is optional, at most 255 characters.
  string reason = 3;
}

// AuditEntry is one row of the GM audit log.
message AuditEntry {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // account is the staff account that acted, and role the role it
  // acted with.
  string account = 3;
  string role = 4;
  // action is what it did, such as staff.give.
  string action = 5;
  // source is admin for the admin API, or game.
  string source = 6;
  string target = 7;
  google.protobuf.Struct arguments = 8;
  string reason = 9;
  bool needs_review = 10;
  // reviewed_at and reviewed_by are set once a review is recorded.
  google.protobuf.Timestamp reviewed_at = 11;
  string reviewed_by = 12;
  // verdict is the review's ok or flag, and review_note its note.
  string verdict = 13;
  string review_note = 14;
  // account_id is the staff account's ID, so the screens can tell the
  // caller's own rows, which the caller may not review.
  int64 account_id = 15;
}

// AuditPage answers GET /audit: rows newest first.
message AuditPage {
  repeated AuditEntry entries = 1;
  // next_before_id is the before_id of the next page, or 0 at the end.
  int64 next_before_id = 2;
}

// ReviewRequest is the body of POST /audit/{id}/review.
message ReviewRequest {
  // verdict is ok or flag.
  string verdict = 1;
  // note is optional, at most 255 characters. A flag needs one.
  string note = 2;
}

// Position is a place on a map.
message Position {
  // map is the map's name, such as prontera.
  string map = 1;
  int32 x = 2;
  int32 y = 3;
}

// Sanction is a mute, a jail, a kick or a ban (decision 0030). The
// search and the character details show the ones in effect. GET
// /sanctions lists ended and lifted ones too.
message Sanction {
  // kind is mute, jail, kick or ban.
  string kind = 1;
  string reason = 2;
  google.protobuf.Timestamp started_at = 3;
  // ends_at is when it ends. It equals started_at for a kick, and is
  // unset for a permanent ban.
  google.protobuf.Timestamp ends_at = 4;
  // issued_by is the staff account, or the mod, that gave it.
  string issued_by = 5;
  // id is the sanction's ID, for DELETE /sanctions/{id}, or 0 for a
  // sanction a mod gave that is not saved yet.
  int64 id = 6;
  // character_id and character are the character of a mute, a jail or
  // a kick. A ban has none.
  int64 character_id = 7;
  string character = 8;
  // account_id and account are the account: the banned one, or the
  // character's.
  int64 account_id = 9;
  string account = 10;
  // permanent is set for a ban without an end.
  bool permanent = 11;
  // lifted_at, lifted_by and lift_reason are set when staff lifted it
  // early.
  google.protobuf.Timestamp lifted_at = 12;
  string lifted_by = 13;
  string lift_reason = 14;
  // active is set while it is in effect.
  bool active = 15;
}

// SanctionRequest is the body of POST /sanctions.
message SanctionRequest {
  // kind is mute, jail, kick or ban.
  string kind = 1;
  // character_id is the character of a mute, a jail or a kick.
  int64 character_id = 2;
  // account_id is the account of a ban.
  int64 account_id = 3;
  // minutes is how long a mute, a jail or a ban lasts. A kick takes 0.
  // A ban of 0 minutes is permanent and needs
  // moderation.ban_permanent.
  int32 minutes = 4;
  // reason is required, at most 255 characters. The player sees it.
  string reason = 5;
}

// SanctionList answers GET /sanctions, newest first.
message SanctionList {
  repeated Sanction sanctions = 1;
  // next_before_id is the before_id of the next page, or 0 at the end.
  int64 next_before_id = 2;
}

// ReportSummary is one report in the queue.
message ReportSummary {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  string reporter = 3;
  int64 reporter_id = 4;
  // target is the reported character's name, or the guild's name.
  string target = 5;
  // target_id is the reported character's ID, or 0.
  int64 target_id = 6;
  // kind is player, line, guild_name or guild_emblem.
  string kind = 7;
  // reason is the reporter's own words.
  string reason = 8;
  string map = 9;
  // status is open or closed.
  string status = 10;
  google.protobuf.Timestamp closed_at = 11;
  // outcome is no_action, warned or sanctioned, once closed.
  string outcome = 12;
  string note = 13;
  // closed_by is the staff account that closed it.
  string closed_by = 14;
  // sanction_id is the sanction of a sanctioned report, or 0.
  int64 sanction_id = 15;
  // guild_id is the reported guild, or 0.
  int64 guild_id = 16;
  // line_id is the reported line's ID, or empty.
  string line_id = 17;
  // target_account_id is the reported character's account, or 0.
  int64 target_account_id = 18;
}

// ReportPage answers GET /reports: reports newest first.
message ReportPage {
  repeated ReportSummary reports = 1;
  // next_before_id is the before_id of the next page, or 0 at the end.
  int64 next_before_id = 2;
}

// ChatLine is one line of the chat log.
message ChatLine {
  // id is the line's UUID.
  string id = 1;
  google.protobuf.Timestamp at = 2;
  // kind is local, whisper, channel, party or guild.
  string kind = 3;
  int64 character_id = 4;
  // name is who said it.
  string name = 5;
  // target is a whisper's target, or a channel's, party's or guild's
  // name.
  string target = 6;
  string map = 7;
  string text = 8;
  // reported is set for the reported line.
  bool reported = 9;
  // seen is set for the lines the reporter saw, which the report keeps.
  // The others are the target's own lines around the report.
  bool seen = 10;
}

// ReportDetail answers GET /reports/{id}.
message ReportDetail {
  ReportSummary report = 1;
  // lines are the lines the reporter saw and the target's lines around
  // the report, oldest first. Lines older than the chat log keeps are
  // gone once the report is closed.
  repeated ChatLine lines = 2;
  // earlier are the target's earlier reports, newest first.
  repeated ReportSummary earlier = 3;
  // sanctions are the target's sanctions, and its account's, newest
  // first.
  repeated Sanction sanctions = 4;
  // emblem_png is the reported emblem as it was, for a guild_emblem
  // report.
  bytes emblem_png = 5;
}

// CloseReportRequest is the body of POST /reports/{id}/close.
message CloseReportRequest {
  // outcome is no_action, warned or sanctioned.
  string outcome = 1;
  // note is optional, at most 255 characters.
  string note = 2;
  // sanction_id links the sanction of a sanctioned report. It is
  // required for sanctioned, and not allowed otherwise.
  int64 sanction_id = 3;
}

// CharacterSummary is a character in the search results.
message CharacterSummary {
  int64 id = 1;
  string name = 2;
  int32 job = 3;
  string job_name = 4;
  int32 base_level = 5;
  int32 job_level = 6;
  bool online = 7;
  // position is where the character is now when online, else where it
  // was saved.
  Position position = 8;
  repeated Sanction sanctions = 9;
}

// LoginRecord is one login of an account, for an IP search.
message LoginRecord {
  string ip = 1;
  google.protobuf.Timestamp at = 2;
  string user_agent = 3;
}

// Owner is where an item or zeny was or went: a holder or an end of the
// transfers (decision 0017).
message Owner {
  // kind is inventory, storage, cart, guild_storage, mail, vending,
  // ground, monster, shop, script, skill, used, fee, event or staff.
  string kind = 1;
  // id is the character, account, guild, mail, monster or skill ID, or
  // 0.
  int64 id = 2;
  // storage is the record ID of an extra storage, or 0.
  uint32 storage = 3;
  // name names the owner for people, such as a character's name, or a
  // mail and its recipient. It is empty when the owner is gone.
  string name = 4;
  // character_id and account_id are the character and the account that
  // the holder belongs to, when there are.
  int64 character_id = 5;
  int64 account_id = 6;
}

// AccountSummary is one account in the search results.
message AccountSummary {
  int64 account_id = 1;
  string account = 2;
  google.protobuf.Timestamp created_at = 3;
  // last_login is the account's last login on the account pages, or
  // unset.
  google.protobuf.Timestamp last_login = 4;
  repeated CharacterSummary characters = 5;
  // logins are the logins of an IP search that matched, newest first.
  repeated LoginRecord logins = 6;
  // ban is the account's ban in effect, or unset.
  Sanction ban = 7;
}

// PlayerSearch answers GET /players.
message PlayerSearch {
  repeated AccountSummary accounts = 1;
  // next_cursor is the cursor of the next page, or empty at the end.
  string next_cursor = 2;
  // holder is where a searched serial is now.
  Owner holder = 3;
}

// Item is one stack or instance of an item.
message Item {
  // serial is the stack's serial, as a UUID.
  string serial = 1;
  uint32 item_id = 2;
  // name is the item's name in the item database.
  string name = 3;
  int32 amount = 4;
  int32 slot = 5;
  int32 refine = 6;
  repeated uint32 cards = 7;
  // equip holds the positions it is worn in, as EQP_ bits, or 0.
  uint32 equip = 8;
  bool identified = 9;
  // bound is the bond, as rAthena's bound_type, or 0.
  int32 bound = 10;
  // rolls are the copy's rolled values, by name.
  map<string, int32> rolls = 11;
}

// Storage is a storage or a cart of a character.
message Storage {
  // kind is cart, storage for the account's storage, or extra for an
  // extra storage.
  string kind = 1;
  // storage is the extra storage's record ID, or 0.
  uint32 storage = 2;
  // name is the extra storage's name, or empty.
  string name = 3;
  repeated Item items = 4;
}

// Mail is a mail in a character's mailbox.
message Mail {
  int64 id = 1;
  string from = 2;
  string title = 3;
  google.protobuf.Timestamp sent_at = 4;
  int64 zeny = 5;
  bool read = 6;
  bool returned = 7;
  repeated Item items = 8;
}

// Currency is an amount of a currency of data/currencies.yml.
message Currency {
  uint32 id = 1;
  string name = 2;
  int64 amount = 3;
  // account is set for a currency the account holds.
  bool account = 4;
}

// Stats are the raised stats.
message Stats {
  int32 str = 1;
  int32 agi = 2;
  int32 vit = 3;
  int32 int = 4;
  int32 dex = 5;
  int32 luk = 6;
}

// CharacterDetail answers GET /characters/{id}. An online character is
// read from its zone, an offline one from the database.
message CharacterDetail {
  int64 id = 1;
  string name = 2;
  int64 account_id = 3;
  string account = 4;
  int32 job = 5;
  string job_name = 6;
  bool male = 7;
  int32 base_level = 8;
  int32 job_level = 9;
  int64 base_exp = 10;
  int64 job_exp = 11;
  Stats stats = 12;
  int32 status_points = 13;
  int32 skill_points = 14;
  int64 hp = 15;
  int64 sp = 16;
  int64 zeny = 17;
  repeated Currency currencies = 18;
  bool online = 19;
  Position position = 20;
  Position save_point = 21;
  string party = 22;
  string guild = 23;
  // inventory holds every item, worn ones too, which have equip set.
  repeated Item inventory = 24;
  repeated Storage storages = 25;
  repeated Mail mails = 26;
  repeated Sanction sanctions = 27;
  google.protobuf.Timestamp created_at = 28;
  // ban is the account's ban in effect, or unset.
  Sanction ban = 29;
}

// ItemMove is one line of the item log.
message ItemMove {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // action is why it moved, such as trade, drop or restore.
  string action = 3;
  Owner from = 4;
  Owner to = 5;
  // serial is the stack the amount ended in, or the stack it left for
  // an end. source is the serial it came from when that differs.
  string serial = 6;
  string source = 7;
  uint32 item_id = 8;
  string item_name = 9;
  int32 amount = 10;
  int32 refine = 11;
  repeated uint32 cards = 12;
  // relation is self for the serial asked for, ancestor for a stack it
  // came from, and descendant for a stack it went into.
  string relation = 13;
}

// ItemHistory answers GET /items/{serial}/history: every move of the
// serial, of the stacks it came from and of the stacks it went into,
// oldest first.
message ItemHistory {
  string serial = 1;
  repeated ItemMove moves = 2;
  // serials are the serials it followed.
  repeated string serials = 3;
  // truncated is set when it stopped at its limits.
  bool truncated = 4;
  // holder is where the serial is now, or unset when it is gone.
  Owner holder = 5;
}

// LogEntry is one line of a character's item or zeny log.
message LogEntry {
  google.protobuf.Timestamp at = 1;
  // kind is item or zeny.
  string kind = 2;
  string action = 3;
  Owner from = 4;
  Owner to = 5;
  string serial = 6;
  string source = 7;
  uint32 item_id = 8;
  string item_name = 9;
  int64 amount = 10;
  int32 refine = 11;
  repeated uint32 cards = 12;
  // currency is the currency's ID for a zeny line, 0 for zeny.
  uint32 currency = 13;
  string currency_name = 14;
  int64 id = 15;
}

// CharacterLogs answers GET /characters/{id}/logs, newest first.
message CharacterLogs {
  repeated LogEntry entries = 1;
  // next_cursor is the cursor of the next page, or empty at the end.
  string next_cursor = 2;
}

// RestoreItem is one serial of a restore.
message RestoreItem {
  // serial is the stack to give back.
  string serial = 1;
  // amount is how many. 0 is the whole stack, or for a copy the amount
  // of the serial's last log line.
  int32 amount = 2;
}

// RestoreRequest is the body of POST /restore.
message RestoreRequest {
  // character_id is the character that gets the items, by mail.
  int64 character_id = 1;
  repeated RestoreItem items = 2;
  // zeny is made for the restore, which needs items.create.
  int64 zeny = 3;
  // reason is required, at most 255 characters.
  string reason = 4;
}

// RestoredItem is what a restore did with one serial.
message RestoredItem {
  string serial = 1;
  // new_serial is the serial in the mail.
  string new_serial = 2;
  // copy is set when the serial was gone and a copy was made.
  bool copy = 3;
  uint32 item_id = 4;
  string item_name = 5;
  int32 amount = 6;
  // from is the holder it was taken from, or the staff end for a copy.
  Owner from = 7;
}

// RestoreResult answers POST /restore.
message RestoreResult {
  int64 mail_id = 1;
  repeated RestoredItem items = 2;
  int64 zeny = 3;
}

// ZoneView is one zone of the world view (decision 0031).
message ZoneView {
  // map is the map's name, such as prontera.
  string map = 1;
  int32 players = 2;
  // monsters counts the living monsters.
  int32 monsters = 3;
  // ticks counts the zone's ticks in the last minute. A zone without
  // players sleeps and does not tick.
  int32 ticks = 4;
  // The work of the last minute's ticks, in microseconds: the tick and
  // what the zone handled since the tick before.
  int64 p50_us = 5;
  int64 p99_us = 6;
  int64 max_us = 7;
  // over_budget counts the last minute's ticks over the 10 ms budget.
  int32 over_budget = 8;
  // asleep is set when the zone sleeps because it has no players.
  bool asleep = 9;
}

// ProcessView is the server process of the world view.
message ProcessView {
  // cpu_cores is the CPU time per second of wall time since the start,
  // so 1.0 is one core. It is 0 where the system does not report it.
  double cpu_cores = 1;
  uint64 heap_bytes = 2;
  uint64 total_bytes = 3;
  uint64 goroutines = 4;
  google.protobuf.Timestamp started_at = 5;
  int64 uptime_seconds = 6;
  string version = 7;
}

// OnlinePlayer is a player in the game.
message OnlinePlayer {
  int64 character_id = 1;
  string name = 2;
  string map = 3;
  int32 x = 4;
  int32 y = 5;
  int32 base_level = 6;
  string job_name = 7;
}

// WorldView answers GET /world.
message WorldView {
  repeated ZoneView zones = 1;
  ProcessView process = 2;
  // players are the players online, by name, at most 1,000.
  repeated OnlinePlayer players = 3;
  // players_online counts every player online.
  int32 players_online = 4;
  // restart is the planned restart, or unset.
  RestartPlan restart = 5;
  // now is the server clock.
  google.protobuf.Timestamp now = 6;
}

// AnnounceRequest is the body of POST /announce.
message AnnounceRequest {
  // text is 1 to 255 characters.
  string text = 1;
  // map is a map's name for one map, or empty for the world.
  string map = 2;
}

// AnnounceResult answers POST /announce.
message AnnounceResult {
  string text = 1;
  string map = 2;
}

// RestartRequest is the body of POST /restart.
message RestartRequest {
  // at is from 1 minute to 7 days ahead of the server clock.
  google.protobuf.Timestamp at = 1;
  // reason is 1 to 255 characters. Players see it when they are
  // disconnected, and restart_planned gets it.
  string reason = 2;
  // message is what the announcements say, at most 255 characters. The
  // reason when empty.
  string message = 3;
}

// RestartPlan is a planned restart. POST and DELETE /restart answer
// with it.
message RestartPlan {
  google.protobuf.Timestamp at = 1;
  string reason = 2;
  string message = 3;
  string planned_by = 4;
  google.protobuf.Timestamp planned_at = 5;
  // logins_closed is set in the last minute, when new logins are
  // refused.
  bool logins_closed = 6;
}

// EventRun is a run of a world event that lasts.
message EventRun {
  google.protobuf.Timestamp scheduled = 1;
  google.protobuf.Timestamp started = 2;
  google.protobuf.Timestamp ends = 3;
}

// EventResult is how a run ended: won, lost, stopped, or ended for a
// script event that ran its time.
message EventResult {
  google.protobuf.Timestamp scheduled = 1;
  google.protobuf.Timestamp started = 2;
  google.protobuf.Timestamp ended = 3;
  string result = 4;
}

// EventOverride is a staff change of an event, saved over the config.
message EventOverride {
  // on is set when the change turned the event on or off.
  optional bool on = 1;
  // trigger is set when the change set the trigger.
  google.protobuf.Struct trigger = 2;
  // duration_minutes is set when the change set the duration.
  int32 duration_minutes = 3;
  string changed_by = 4;
  google.protobuf.Timestamp changed_at = 5;
}

// EventInfo is one world event of GET /events.
message EventInfo {
  // name is the full name, such as core:Field_Boss.
  string name = 1;
  string display_name = 2;
  string mod = 3;
  // type is boss, invasion, treasure_hunt or script.
  string type = 4;
  bool on = 5;
  // trigger is the trigger in the form of data/events.yml, such as
  // {"daily": "20:00"}, and trigger_text says it for people.
  google.protobuf.Struct trigger = 6;
  string trigger_text = 7;
  int32 duration_minutes = 8;
  // next_run is the trigger's next time, or unset.
  google.protobuf.Timestamp next_run = 9;
  repeated EventRun runs = 10;
  // results are the latest results since the server started, newest
  // first.
  repeated EventResult results = 11;
  // override is the staff change, or unset.
  EventOverride override = 12;
  // What the config says, for a reset.
  bool config_on = 13;
  string config_trigger_text = 14;
  int32 config_duration_minutes = 15;
  // failed is the error of the last run that did not start.
  string failed = 16;
  google.protobuf.Timestamp failed_at = 17;
}

// EventList answers GET /events.
message EventList {
  repeated EventInfo events = 1;
  // rotations are a procedural world's rotating dungeons, and seasons its
  // world changes (decision 0045). A classic world has neither.
  repeated RotationInfo rotations = 2;
  SeasonInfo seasons = 3;
}

// WorldChange is a rotation or a region's change that waits for its
// time (decision 0045).
message WorldChange {
  // at is when it happens.
  google.protobuf.Timestamp at = 1;
  // forced is set for a change staff forced.
  bool forced = 2;
  // date is a rotation's new date. season is a region's new season, and
  // region its town's ID.
  string date = 3;
  string region = 4;
  int32 season = 5;
}

// RotationInfo is a rotating dungeon of GET /events.
message RotationInfo {
  // dungeon is its ID, such as crypt, and name its first floor's display
  // name without the floor.
  string dungeon = 1;
  string name = 2;
  // rotation says when it rotates, such as "weekly on friday at 20:00",
  // in the server's time zone.
  string rotation = 3;
  // date is the date of the floors that run.
  string date = 4;
  // next is the rotation that waits, or unset.
  WorldChange next = 5;
}

// RegionInfo is a region of GET /events: the fields whose nearest town
// is one town.
message RegionInfo {
  // region is the town's ID, such as t2, and name the town's display
  // name.
  string region = 1;
  string name = 2;
  int32 season = 3;
  int32 fields = 4;
  // forced is the change staff forced that waits, or unset.
  WorldChange forced = 5;
}

// SeasonInfo is the world changes of GET /events.
message SeasonInfo {
  // days is procedural.seasons.days, 0 when seasons are off. started is
  // the date they started, and ends how many season ends changed a
  // region.
  int32 days = 1;
  string started = 2;
  int32 ends = 3;
  // next is the next season end's change, or unset.
  WorldChange next = 4;
  repeated RegionInfo regions = 5;
}

// EventChange is the body of PATCH /events/{name}. Fields that are not
// set keep their value.
message EventChange {
  optional bool on = 1;
  google.protobuf.Struct trigger = 2;
  // duration_minutes is 1 to 10,080, or 0 to keep it.
  int32 duration_minutes = 3;
  // reason is optional, at most 255 characters.
  string reason = 4;
}

// EventAction is the body of POST /events/{name}/start, /stop and
// /reset.
message EventAction {
  // reason is optional, at most 255 characters.
  string reason = 1;
}

// ModSwitch is a mod that staff turned off.
message ModSwitch {
  // map is a map's name, or empty for every zone.
  string map = 1;
  string reason = 2;
  string changed_by = 3;
  google.protobuf.Timestamp changed_at = 4;
}

// ModZone is a mod's state in one zone.
message ModZone {
  string map = 1;
  bool off = 2;
  // errors counts the mod's script errors in the zone since the server
  // started, with the last error and its time.
  int64 errors = 3;
  string last_error = 4;
  google.protobuf.Timestamp last_error_at = 5;
}

// ModInfo is one loaded mod of GET /mods.
message ModInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  // builtin is set for core and the core ruleset mods. Core cannot be
  // turned off.
  bool builtin = 4;
  // signature is builtin, folder, unsigned or unverified: a .zip file
  // with a .minisig file next to it, which the server does not check.
  string signature = 5;
  // granted are the permissions the mod holds. requested are those its
  // manifest asks for. pending are requested permissions the owner has
  // not approved. A mod with any does not load, so a loaded mod has
  // none.
  repeated string granted = 6;
  repeated string requested = 7;
  repeated string pending = 8;
  // switches are the zones where staff turned it off.
  repeated ModSwitch switches = 9;
  // zones are the zones where it is off or had errors.
  repeated ModZone zones = 10;
  // errors counts its script errors in every zone.
  int64 errors = 11;
  // scripts is set when it has Lua scripts.
  bool scripts = 12;
}

// ModList answers GET /mods.
message ModList {
  repeated ModInfo mods = 1;
  // maps are the maps that run, for the zone choice.
  repeated string maps = 2;
}

// ModSwitchRequest is the body of POST /mods/{id}/disable and /enable.
message ModSwitchRequest {
  // map is a map's name, or empty for every zone.
  string map = 1;
  // reason is 1 to 255 characters to turn a mod off, and optional to
  // turn it on.
  string reason = 2;
}

// Error is the body of every answer that is not 2xx.
message Error {
  // code is one of: login, two_factor, forbidden, reauth, csrf, rate,
  // bad_request, not_found, conflict, unavailable.
  string code = 1;
  // message is for people.
  string message = 2;
  // reauth_url is set for reauth.
  string reauth_url = 3;
}
