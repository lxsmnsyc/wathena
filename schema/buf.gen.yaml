version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  # TypeScript for the web client. Run `pnpm install` in client/ first.
  - local: ["../client/node_modules/.bin/protoc-gen-es"]
    out: ../client/src/gen
    opt:
      - target=ts
