# wAthena all-in-one deployment: waserver, PostgreSQL 18, and Caddy for
# TLS (strategy section 3.9). deploy/README.md has the steps.
#
# Services:
#   - postgres: the database. Only reachable on the internal db network.
#   - db-init: runs once per `up`. Makes the database and roles from
#     ../postgres/roles.sql on the first run, and sets the roles'
#     passwords from the secrets on every run.
#   - verify-init: only with the verify profile. Makes the
#     wathena_verify role of backup-verify and sets its password.
#   - migrate: runs once per `up`, after db-init. Applies pending
#     migrations with `wactl migrate up` as the migrator role.
#   - waserver: the game, the account pages, the assets and the web
#     client, on one origin. Starts after migrate succeeds.
#   - caddy: the only public service. Gets certificates for
#     WATHENA_DOMAIN and proxies everything to waserver.
#   - backup: makes an encrypted backup into the backups volume once a
#     day with `wactl world backup --every`, and prunes old ones
#     (decision 0048). It connects as wathena_backup, which reads every
#     table and changes nothing. It needs the recipient, the public key, in the
#     backup_recipients secret. The identity, the private key, stays
#     with the owner. Without a recipient it makes no backup and logs a
#     warning every hour. It reads the secret only when it starts, so
#     run `docker compose up -d --force-recreate backup` after adding
#     the recipient.
#   - backup-verify: only with the verify profile. Restores the newest
#     backup into a temporary database once a day and checks it. It
#     puts the identity on the server, so a stolen server can decrypt
#     the backups. deploy/README.md, "Backups", explains the choice.
#   - wactl: only for `docker compose run`. Makes the world, and makes
#     and restores backups, as the migrator role.
#   - offline: only for `docker compose run`. wactl with no network and
#     no secrets, for asset builds and other work on untrusted files.
#   - caddy-init: runs once per `up`. Gives Caddy's volumes to the user
#     that Caddy runs as.

name: wathena

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# The wactl image: wactl with the PostgreSQL client tools.
x-tools-image: &tools-image
  image: ${WATHENA_TOOLS_IMAGE:-wathena/wactl:local}
  build:
    context: ../..
    target: tools
    args:
      VERSION: ${WATHENA_VERSION:-local}

# wactl as the migrator role.
x-tools: &tools
  <<: *tools-image
  environment:
    WATHENA_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
  secrets: [migrate_database_url]
  networks: [db]
  depends_on:
    db-init:
      condition: service_completed_successfully
  restart: "no"

services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    # It starts as the postgres user, so it needs no Linux capabilities.
    # The image's data folder belongs to that user, and so does a new
    # volume made from it.
    <<: *hardening
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    shm_size: 256mb
    tmpfs: [/var/run/postgresql, /tmp]
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    <<: *hardening
    user: postgres
    entrypoint: ["sh", "/deploy/init-db.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
    secrets: [postgres_password, migrator_password, game_password, account_password, backup_password]
    volumes:
      - ../postgres/roles.sql:/deploy/roles.sql:ro
      - ./init-db.sh:/deploy/init-db.sh:ro
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Makes the verify role only for the verify profile, so a stack
  # without backup-verify has no role that may make databases.
  verify-init:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    <<: *hardening
    profiles: [verify]
    user: postgres
    entrypoint: ["sh", "/deploy/init-verify.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
    secrets: [postgres_password, verify_password]
    volumes:
      - ./init-verify.sh:/deploy/init-verify.sh:ro
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    <<: [*tools, *hardening]
    command: [migrate, up]

  wactl:
    <<: [*tools, *hardening]
    profiles: [tools]
    command: []
    volumes:
      - ${WATHENA_ASSETS:-assets}:/srv/assets
    tmpfs: [/tmp]

  # Asset builds read game clients, art packs and mods, which are
  # untrusted files. This service has no network and no secrets, so a
  # bug in a parser cannot reach the database.
  offline:
    <<: [*tools-image, *hardening]
    profiles: [tools]
    command: []
    network_mode: none
    volumes:
      - ${WATHENA_ASSETS:-assets}:/srv/assets
    tmpfs: [/tmp]
    restart: "no"

  backup:
    <<: [*tools, *hardening]
    restart: unless-stopped
    command:
      - world
      - backup
      - --dir=/backups
      - --recipients-file=/run/secrets/backup_recipients
      - --every=${WATHENA_BACKUP_EVERY:-24h}
      - --keep-daily=${WATHENA_BACKUP_KEEP_DAILY:-7}
      - --keep-weekly=${WATHENA_BACKUP_KEEP_WEEKLY:-4}
      # Without a recipient, wait and warn instead of failing, so
      # `docker compose up --wait` passes on a new stack.
      - --wait-for-recipient
    # Only the backup role, which reads every table and changes nothing.
    # Restores run in the wactl service as the migrator.
    environment:
      WATHENA_BACKUP_DATABASE_URL_FILE: /run/secrets/backup_database_url
    secrets: [backup_database_url, backup_recipients]
    volumes:
      - backups:/backups
    tmpfs: [/tmp]
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup-verify:
    <<: [*tools, *hardening]
    profiles: [verify]
    restart: unless-stopped
    command:
      - world
      - verify-backup
      - --dir=/backups
      - --identity=/run/secrets/backup_identity
      - --every=${WATHENA_VERIFY_EVERY:-24h}
    # Only the verify role, which may make databases and has no rights on
    # the world's database.
    environment:
      WATHENA_VERIFY_DATABASE_URL_FILE: /run/secrets/verify_database_url
    secrets: [verify_database_url, backup_identity]
    volumes:
      - backups:/backups:ro
    tmpfs: [/tmp]
    depends_on:
      verify-init:
        condition: service_completed_successfully

  waserver:
    <<: *hardening
    image: ${WATHENA_IMAGE:-wathena/waserver:local}
    build:
      context: ../..
      args:
        VERSION: ${WATHENA_VERSION:-local}
    # unless-stopped also starts waserver again after a planned restart
    # from the admin screens, which exits with status 75 (deploy/README.md,
    # "Planned restarts").
    restart: unless-stopped
    command:
      - all
      - --config=/etc/wathena/waserver.yml
      - --public-url=https://${WATHENA_DOMAIN:?set WATHENA_DOMAIN in .env}:${WATHENA_HTTPS_PORT:-443}
      - --trusted-proxies=${WATHENA_PROXY_IP:-172.30.80.10}
    environment:
      WATHENA_DATABASE_URL_FILE: /run/secrets/game_database_url
      WATHENA_ACCOUNT_DATABASE_URL_FILE: /run/secrets/account_database_url
      WATHENA_ACCOUNT_SECRET_KEY_FILE: /run/secrets/account_secret_key
    secrets: [game_database_url, account_database_url, account_secret_key]
    volumes:
      - ${WATHENA_ASSETS:-assets}:/srv/assets:ro
      - ${WATHENA_CONFIG:-./waserver.yml}:/etc/wathena/waserver.yml:ro
      - cache:/var/cache/wathena
    networks: [edge, db]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # SIGTERM announces a 10 second countdown, then saves every player.
    # Give both time. A longer shutdown_countdown needs a longer grace.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/usr/local/bin/waserver", "health"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 3

  # Caddy's volumes belong to root in the image. This gives them to the
  # user that Caddy runs as, also on a stack made before Caddy ran as
  # that user.
  caddy-init:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    <<: *hardening
    cap_add: [CHOWN, DAC_READ_SEARCH]
    user: root
    entrypoint: ["chown", "-R", "65532:65532", "/data", "/config"]
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: "no"

  caddy:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    <<: *hardening
    # Not root. The image's caddy binary has the file capability
    # NET_BIND_SERVICE, and the kernel refuses to run it without that
    # capability in the container's set.
    user: "65532:65532"
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    environment:
      WATHENA_DOMAIN: ${WATHENA_DOMAIN}
    ports:
      - ${WATHENA_HTTP_PORT:-80}:80
      - ${WATHENA_HTTPS_PORT:-443}:443
      - ${WATHENA_HTTPS_PORT:-443}:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    networks:
      edge:
        ipv4_address: ${WATHENA_PROXY_IP:-172.30.80.10}
    depends_on:
      caddy-init:
        condition: service_completed_successfully
      waserver:
        condition: service_healthy
    healthcheck:
      # The Caddyfile answers on this port inside the container only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  # Caddy and waserver. waserver believes X-Forwarded-For only from
  # Caddy's fixed address.
  edge:
    ipam:
      config:
        - subnet: ${WATHENA_EDGE_SUBNET:-172.30.80.0/24}
  # The database network has no route out.
  db:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  # The asset build, unless WATHENA_ASSETS names a folder instead.
  assets:
  # waserver's converted scripts cache (cache_dir). Safe to delete: the
  # next start converts again.
  cache:
  # The backup service's backups. `docker compose down -v` deletes them
  # with the database. Copy them to another machine too.
  backups:

# ./secrets.sh makes these files. Each service only gets the ones it needs.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  migrator_password:
    file: ./secrets/migrator_password
  game_password:
    file: ./secrets/game_password
  account_password:
    file: ./secrets/account_password
  backup_password:
    file: ./secrets/backup_password
  migrate_database_url:
    file: ./secrets/migrate_database_url
  backup_database_url:
    file: ./secrets/backup_database_url
  game_database_url:
    file: ./secrets/game_database_url
  account_database_url:
    file: ./secrets/account_database_url
  account_secret_key:
    file: ./secrets/account_secret_key
  verify_password:
    file: ./secrets/verify_password
  verify_database_url:
    file: ./secrets/verify_database_url
  # The backup key's recipient (public key), and its identity (private
  # key) for the verify profile only. secrets.sh never makes the
  # identity. The variables name other files, such as for a test.
  backup_recipients:
    file: ${WATHENA_BACKUP_RECIPIENTS:-./secrets/backup_recipients}
  backup_identity:
    file: ${WATHENA_BACKUP_IDENTITY:-./secrets/backup_identity}
