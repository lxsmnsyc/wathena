# waserver settings for the Compose stack (`waserver all --config`).
# Flags in docker-compose.yml set public_url and trusted_proxies from
# .env. Secrets never go here: they come from Docker secrets.
#
# Every key, with its flag, is in server/README.md, "All-in-one".

listen: 0.0.0.0:8300
assets: /srv/assets

# The maps of a classic world: where new characters start, and the
# maps to run, as a list, or all for every map in the asset build. The
# start map must be one of them. A procedural world runs its generated
# maps and ignores this block, so this file serves both world modes.
classic:
  start_map: prontera
  maps: all

# The rAthena mode whose monsters, drops and tables to use: renewal or
# pre-renewal.
mode: renewal

# The countdown players see before the server stops. Keep it shorter
# than stop_grace_period in docker-compose.yml.
# shutdown_countdown: 10s

# A captcha on signup and after repeated failed logins. Only none is ready for
# production: a real provider is not built yet.
captcha: none

# More web client origins that may use this server, such as a community
# client on another host. The public URL's origin is always trusted.
# origins:
#   - https://client.example.com

# Mods (server/README.md, "Mods"). Mount a folder of mods, then name it
# here. Permissions that need approval are approved by mod ID.
# mods:
#   dir: /srv/mods
#   approve:
#     example.halloween-event: [player.give_items]

# Staff (server/README.md, "Staff and admin tools"). Owners have every
# permission and give the other roles at /admin. A role counts only
# after a login with TOTP or a passkey. Name the account of
# `wactl world new --admin` here, as the command prints.
# staff:
#   owners: [Admin]

# How long the server keeps data, in days, 1 to 3650 (server/README.md,
# "Retention"). These are the defaults of the privacy policy. A longer
# period logs a warning and shows one on the admin status page.
# retention:
#   login_ip_days: 90
#   chat_days: 30
#   item_log_days: 180
#   audit_days: 730

# The privacy notice at /account/privacy (server/README.md, "The account
# page"). Players see both as plain text. Fill them in with how players
# reach you about their data.
# privacy:
#   contact: privacy@example.com
#   text: |
#     Who runs this server, and what you do with players' data.
