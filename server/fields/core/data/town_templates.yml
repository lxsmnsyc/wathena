# Core's town templates (proposal 0002, review decision 42). Mods change
# these by name and add their own (mods/README.md, "Town templates").
# size and footprint are in cells. A building's places are the tags of
# the named places at its door, where NPC records with a place stand.
# A building with places must fit, or the town is made again.
- name: hamlet
  size: 96
  gates: 2
  walls: false
  tileset: town
  decorations: [tree, well, crate]
  buildings:
    - {model: smithy, footprint: [8, 6], places: [blacksmith]}
    - {model: inn, footprint: [8, 8], places: [inn]}
    - {model: storehouse, footprint: [6, 6], places: [storage]}
    - {model: tool_shop, footprint: [6, 6], places: ["shop:tool"]}
    - {model: house, footprint: [6, 6], count: 10}
- name: village
  size: 128
  gates: 3
  walls: true
  tileset: town
  decorations: [tree, well, bush]
  buildings:
    - {model: smithy, footprint: [8, 6], places: [blacksmith]}
    - {model: inn, footprint: [8, 8], places: [inn]}
    - {model: storehouse, footprint: [6, 6], places: [storage]}
    - {model: tool_shop, footprint: [6, 6], places: ["shop:tool"]}
    - {model: weapon_shop, footprint: [6, 6], places: ["shop:weapon"]}
    - {model: armor_shop, footprint: [6, 6], places: ["shop:armor"]}
    - {model: chapel, footprint: [8, 10], places: [healer]}
    - {model: house, footprint: [6, 6], count: 16}
    - {model: cottage, footprint: [4, 4], count: 12}
- name: city
  size: 192
  gates: 4
  walls: true
  tileset: town
  decorations: [tree, well, bush, crate]
  buildings:
    - {model: smithy, footprint: [8, 6], places: [blacksmith]}
    - {model: inn, footprint: [8, 8], places: [inn]}
    - {model: storehouse, footprint: [6, 6], places: [storage, "storage:guild"]}
    - {model: tool_shop, footprint: [6, 6], places: ["shop:tool"]}
    - {model: weapon_shop, footprint: [6, 6], places: ["shop:weapon"]}
    - {model: armor_shop, footprint: [6, 6], places: ["shop:armor"]}
    - {model: chapel, footprint: [8, 10], places: [healer]}
    - {model: warp_tower, footprint: [6, 6], places: [teleport]}
    - {model: manor, footprint: [10, 8], count: 6}
    - {model: house, footprint: [6, 6], count: 40}
    - {model: cottage, footprint: [4, 4], count: 30}
