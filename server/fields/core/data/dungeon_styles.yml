# Core's dungeon styles (proposal 0002, review decision 42). A dungeon's
# floors follow its style. Mods change these by name and add their own
# (mods/README.md, "Dungeon styles"). floor_size and room_size are in
# cells. Each floor's level band is level_step levels above the floor
# before it.
- name: cave
  method: cave
  floors: 3
  floor_size: [128, 128]
  room_size: [6, 12]
  tileset: cave
  level_step: 5
- name: crypt
  method: rooms
  floors: 3
  floor_size: [128, 128]
  room_size: [8, 20]
  tileset: crypt
  level_step: 6
- name: tower
  method: rooms
  floors: 5
  floor_size: [80, 80]
  room_size: [8, 16]
  tileset: tower
  level_step: 4
- name: ruins
  method: rooms
  floors: 2
  floor_size: [160, 160]
  room_size: [10, 24]
  tileset: ruins
  level_step: 8
