<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wAthena</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bubbles"></div>
    <div id="item-label" hidden></div>
    <div id="hits"></div>
    <div id="loading" role="status" hidden></div>
    <form id="controls">
      <label>
        Map
        <input id="map" name="map" autocomplete="off" spellcheck="false" />
      </label>
      <button type="submit">Load</button>
      <button id="sound" type="button">Sound off</button>
      <button id="status-toggle" type="button" title="Status (Alt+A)" hidden>Status</button>
      <button id="inventory-toggle" type="button" title="Items (Alt+E)" hidden>Items</button>
      <button id="equipment-toggle" type="button" title="Equipment (Alt+Q)" hidden>Equip</button>
      <button id="characters" type="button" hidden>Characters</button>
      <output id="status"></output>
      <output id="hp"></output>
      <output id="exp"></output>
      <output id="message"></output>
    </form>
    <div id="dock">
      <section id="chat" aria-label="Chat" hidden>
        <ol id="chat-log" aria-live="polite"></ol>
        <input
          id="chat-input"
          maxlength="255"
          autocomplete="off"
          spellcheck="false"
          placeholder="Press Enter to chat"
          aria-label="Chat message"
        />
      </section>
    </div>
    <section id="status-window" aria-label="Status" hidden></section>
    <section id="inventory-window" aria-label="Items" hidden></section>
    <section id="equipment-window" aria-label="Equipment" hidden></section>
    <div id="cutins"></div>
    <section id="dialog-window" aria-label="NPC" hidden></section>
    <section id="shop-window" aria-label="Shop" hidden></section>
    <div id="progress" hidden><div></div></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
