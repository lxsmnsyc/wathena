<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>wAthena</title>
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="guild-labels"></div>
    <div id="shop-boards"></div>
    <div id="quest-icons"></div>
    <div id="bubbles"></div>
    <div id="item-label" hidden></div>
    <div id="cast-bars"></div>
    <div id="hits"></div>
    <div id="loading" role="status" hidden></div>
    <div id="event-banner" role="status" hidden></div>
    <section id="world-events" aria-label="World events" hidden></section>
    <form id="controls">
      <button id="menu-toggle" type="button" aria-expanded="false">Menu</button>
      <label>
        Map
        <input id="map" name="map" autocomplete="off" spellcheck="false" />
      </label>
      <button type="submit">Load</button>
      <button id="sound" type="button">Sound off</button>
      <button id="status-toggle" type="button" title="Status (Alt+A)" hidden>Status</button>
      <button id="inventory-toggle" type="button" title="Items (Alt+E)" hidden>Items</button>
      <button id="equipment-toggle" type="button" title="Equipment (Alt+Q)" hidden>Equip</button>
      <button id="cart-toggle" type="button" title="Cart (Alt+W)" hidden>Cart</button>
      <button id="skill-toggle" type="button" title="Skills (Alt+S)" hidden>Skills</button>
      <button id="party-toggle" type="button" title="Party (Alt+Z)" hidden>Party</button>
      <button id="booking-toggle" type="button" title="Party booking (Alt+B)" hidden>
        Booking
      </button>
      <button id="guild-toggle" type="button" title="Guild (Alt+G)" hidden>Guild</button>
      <button id="mail-toggle" type="button" title="Mail (Alt+M)" hidden>Mail</button>
      <button id="quest-toggle" type="button" title="Quests (Alt+U)" hidden>Quests</button>
      <button id="world-map-toggle" type="button" title="World map (Ctrl+`)" hidden>
        World Map
      </button>
      <button id="options-toggle" type="button">Options</button>
      <button id="characters" type="button" hidden>Characters</button>
      <output id="status"></output>
      <output id="hp"></output>
      <output id="exp"></output>
      <output id="message"></output>
    </form>
    <div id="dock">
      <section id="friend-panel" aria-label="Friends" hidden></section>
      <section id="block-panel" aria-label="Blocked players" hidden></section>
      <section id="chat" aria-label="Chat" hidden>
        <div id="chat-bar">
          <div id="chat-tabs" role="tablist" aria-label="Chat tabs"></div>
          <button id="friend-toggle" type="button" title="Friends (Alt+H)">Friends</button>
          <button id="block-toggle" type="button" title="Blocked players">Blocked</button>
        </div>
        <ol id="chat-log" aria-live="polite"></ol>
        <input
          id="chat-input"
          maxlength="255"
          autocomplete="off"
          spellcheck="false"
          placeholder="Press Enter to chat"
          aria-label="Chat message"
          enterkeyhint="send"
        />
        <button id="chat-send" type="button">Send</button>
      </section>
    </div>
    <section id="options-window" aria-label="Options" hidden>
      <label
        ><input id="joystick-option" type="checkbox" checked /> Show the joystick on touch
        screens</label
      >
    </section>
    <section id="status-window" aria-label="Status" hidden></section>
    <section id="inventory-window" aria-label="Items" hidden></section>
    <section id="equipment-window" aria-label="Equipment" hidden></section>
    <section id="skill-window" aria-label="Skills" hidden></section>
    <section id="party-window" aria-label="Party" hidden></section>
    <section id="booking-window" aria-label="Party booking" hidden></section>
    <section id="guild-window" aria-label="Guild" hidden></section>
    <section id="storage-window" class="storage-window" aria-label="Storage" hidden></section>
    <section id="cart-window" class="storage-window" aria-label="Cart" hidden></section>
    <section id="trade-window" aria-label="Trade" hidden></section>
    <section id="world-map-window" aria-label="World Map" hidden></section>
    <section id="quest-window" aria-label="Quests" hidden></section>
    <div id="player-menu" hidden></div>
    <div id="social-prompts" aria-live="polite" hidden></div>
    <div id="cutins"></div>
    <section id="dialog-window" aria-label="NPC" hidden></section>
    <section id="shop-window" aria-label="Shop" hidden></section>
    <section id="mail-window" aria-label="Mail" hidden></section>
    <section id="vending-setup" class="store-window" aria-label="Open a shop" hidden></section>
    <section id="vending-own" class="store-window" aria-label="Your shop" hidden></section>
    <section id="vending-browse" class="store-window" aria-label="Shop" hidden></section>
    <section
      id="buying-setup"
      class="store-window"
      aria-label="Open a buying store"
      hidden
    ></section>
    <section id="buying-own" class="store-window" aria-label="Your buying store" hidden></section>
    <section id="buying-browse" class="store-window" aria-label="Buying store" hidden></section>
    <section id="store-search" class="store-window" aria-label="Store search" hidden></section>
    <div id="progress" hidden><div></div></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
