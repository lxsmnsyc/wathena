# The effects the web client plays for skills, by rAthena skill ID, and
# for the skill units of ground skills, by rAthena UNT_ ID. The effect
# IDs are RO effect IDs from effects.yml.
#
# A skill lists the effects it plays at each moment:
# - caster: on the caster, once each time the skill takes effect. This is
#   roBrowser's beginCastEffectId and effectIdOnCaster.
# - effect: on the target, an entity or a cell, once each time the skill
#   takes effect, with or without damage. This is roBrowser's effectId
#   and successEffectId.
# - hit: on the target for each hit that deals damage. This is
#   roBrowser's hitEffectId.
# - aura: false for skills that show no cast aura while they cast.
#
# Casts show the aura of the skill's element, from auras below, for the
# cast time. A mod's skill plays the effects of the core skill that its
# skill list entry names as its icon.
#
# A skill unit shows its effect on its cell for as long as it stays, and
# plays its sounds once. A unit without an effect, such as
# UNT_DUMMYSKILL, plays its skill's effect once on its cell instead.
# Thunder Storm is one such unit.
#
# Some roBrowser effects are not here, since the client cannot draw them
# yet:
# - Projectiles before a hit (beforeHitEffectId and releaseEffectId): the
#   Soul Strike, Fire Ball, Cold Bolt and Fire Bolt projectiles, Frost
#   Diver's ice path, Stone Fling's stone, and the arrows of Double
#   Strafe, Arrow Shower and Arrow Repel.
# - Magnum Break's quake, a camera shake.
# - Sand Attack's effect 310, which roBrowser's table lacks.
# - Sight, Ruwach's light, Hiding and Play Dead, which show as statuses.
#
# Entries are from roBrowserLegacy (GPL-3.0), src/DB/Skills/SkillEffect.js,
# src/DB/Skills/SkillUnit.js, and src/Engine/MapEngine/Entity.js
# (onEntityCastSkill) at commit 58759ab22d1d56da7f6719ee45cb475f7e851227,
# by Vincent Thibault, Antares, and contributors.

