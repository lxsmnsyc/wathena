# Job looks for the web client (strategy section 10.5, assets-v1).
#
# A look is one body sprite: sprite/body/<look>/<m|f> and palette/body/<look>/<m|f>/<n>.
# grf_sprite is the sprite's file name in the game client, which the GRF importer uses.
# race is the sprite folder: human (인간족) or doram (도람족).
# sex is m or f for looks that exist for one sex only, as RO's bard and
# dancer lines do. Other looks exist for both.
#
# Jobs map rAthena job IDs to a look, and to the look used while riding a mount.
#
# Sprite names and mount looks are from roBrowserLegacy (GPL-3.0),
# src/DB/Jobs/JobNameTable.js and AllMountTable.js at commit 58759ab22d1d56da7f6719ee45cb475f7e851227,
# by Vincent Thibault, Antares, and contributors.
# Changes:
# - elemental_master_riding uses the spelling in Gravity's files, elemetal_master_riding.
# - Baby, high, and second forms without their own entry use their base job's look.
# - JOB_ARCHBISHOP_2ND, spelled ARCH_BISHOP_2ND in roBrowser, uses the archbishop look.
#
# This file was generated once from those sources. Edit it by hand from now on.
#
# Jobs with no player sprite name, left out:
# - JOB_HANBOK
# - JOB_OKTOBERFEST
# - JOB_SUMMER2
# - JOB_GANGSI
# - JOB_DEATH_KNIGHT
# - JOB_DARK_COLLECTOR
# - JOB_SECOND_JOB_START
# - JOB_SECOND_JOB_END

