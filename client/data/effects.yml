# Effects by RO effect ID for the web client (strategy section 10.5,
# assets-v1). Maps place effects by these IDs, and skills will too.
#
# Each entry lists what the effect shows. A part is one of:
# - effect: a baked STR effect, effect/<name>. With variants, one of the
#   listed effects is chosen at random each time the effect starts.
# - sound: a sound to play when the effect starts, sound/<path>, from
#   data\wav\<path>.wav. roBrowser calls it wav.
# - cylinder: a textured cone that the client draws, as roBrowser's
#   CYLINDER type. Its fields are roBrowser's, renamed:
#   - texture: textureName, as texture/effect/<name>.
#   - bottom, top and height: bottomSize, topSize and height, in cells.
#   - color and alpha: red, green, blue and alphaMax.
#   - duration_ms: duration.
#   - copies and copy_ms: duplicate and timeBetweenDupli. Each copy
#     starts copy_ms after the one before.
#   - animation: how the size changes over the duration, 0 to 5.
#   - fade: fades in over the first quarter and out over the last.
#   - repeat: starts again at the end, for effects that stay, such as
#     warp portals.
#   Cylinders add their colors to the scene, as roBrowser's blendMode 2.
#
# Effects that attach to an entity, such as level ups, play at its feet
# and follow it.
#
# Besides level ups (158, 371), the potion effects that play when a
# player uses a potion or herb (204 to 209), and the warp portal (321),
# the map effects whose parts are STR effects are listed. The most common
# map effects, such as torches (47) and emitters (974), are sprite
# particles, which need a particle system in the client first.
#
# The effects of the first class skills that skills.yml names follow
# the others, with the parts the client draws. Their 2D and 3D particles,
# sprite effects, and FUNC parts are left out, and some keep only their
# sound. The cast auras (12, 54 to 59, 454) last as long as the cast.
#
# Entries are from roBrowserLegacy (GPL-3.0), src/DB/Effects/EffectTable.js
# at commit 58759ab22d1d56da7f6719ee45cb475f7e851227, by Vincent Thibault,
# Antares, and contributors.

