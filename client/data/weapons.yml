# Weapon types for the web client (strategy section 10.5, assets-v1).
#
# Each rAthena weapon type (item_db SubType, the W_ constants) has:
# - view: the weapon sprite drawn for items of this type without their own
#   view, sprite/weapon/<look>/<sex>/<view>. 0 draws no weapon.
# - attack: sounds played when an attack starts, one chosen at random.
# - hit: sounds played when the attack lands, one chosen at random.
#
# Sounds are from roBrowserLegacy (GPL-3.0), src/DB/Items/WeaponSoundTable.js
# and WeaponHitSoundTable.js at commit 58759ab22d1d56da7f6719ee45cb475f7e851227,
# by Vincent Thibault, Antares, and contributors.
# Changes:
# - File names are asset names: data\wav\attack_sword.wav is sound/attack_sword.
# - Dual-wield combinations are left out. The client draws both weapons.

weapons:
  - id: 0
    constant: W_FIST
    name: fist
    view: 0
    attack: [sound/attack_fist]
    hit: [sound/_hit_fist1, sound/_hit_fist2, sound/_hit_fist3, sound/_hit_fist4]
  - id: 1
    constant: W_DAGGER
    name: dagger
    view: 1
    attack: [sound/attack_short_sword, sound/attack_short_sword_]
    hit: [sound/_hit_sword]
