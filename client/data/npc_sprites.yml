# NPC sprites for the web client (strategy section 10.5).
#
# Each entry maps an NPC sprite ID, which the protocol sends as Look.body
# for NPCs, to the sprite's asset name: sprite/npc/<sprite>. The client
# draws an NPC whose ID is missing here as nothing.
#
# IDs and names are rAthena's NPC sprite constants (GPL-3.0), from
# reference/rathena/extracts/renewal/client_tables.json, which lists the
# same sprites for both modes. Names are lowercase, as the GRF importer
# names sprite files. 45 is the warp portal, which the client draws as an
# effect instead.
