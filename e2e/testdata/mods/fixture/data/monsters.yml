# A monster that stands still, never attacks, and always drops a Jellopy
# and a Test Charm. AI type 6 has no modes: it cannot move or attack. Its
# level is the test players' base level, so renewal's drop penalty for a
# level difference does not apply. Its sprite is the fixture's art, so its
# stats start from a Poring's.
- name: e2e.fixture:DUMMY
  sprite: mod/e2e.fixture/sprite/mob/Dummy
  display_name: Dummy
  level: 50
  hp: 40
  base_exp: 10
  job_exp: 10
  ai: 6
  drops:
    - {item: Jellopy, rate: 10000}
    - {item: "e2e.fixture:Charm", rate: 10000}

# The boss of the Boss event: it stands still and never attacks, so a
# test kills it at its own pace. It starts from the Poring's stats.
- name: e2e.fixture:BOSS
  sprite: PORING
  display_name: Boss
  level: 50
  hp: 60
  base_exp: 10
  job_exp: 10
  class: boss
  ai: 6
  drops:
    - {item: Jellopy, rate: 10000}

# The invaders of the Raid event. AI type 04 attacks players on sight;
# they hit for 1.
- name: e2e.fixture:RAIDER
  sprite: PORING
  display_name: Raider
  level: 50
  hp: 40
  attack: 1
  base_exp: 1
  job_exp: 1
  ai: 4

# The chest of the Hunt event. Its drop is the loot.
- name: e2e.fixture:CHEST
  sprite: TREASURE_BOX1
  display_name: Chest
  level: 50
  hp: 1
  class: event
  ai: 6
  drops:
    - {item: Jellopy, rate: 10000}

# The Training Dummy of the browser checks' exit check: a Dummy worth a
# million base and job exp, so one kill takes a player up a level. It
# shows the Dummy's sprite. "!trainer" places one next to the speaker.
- name: e2e.fixture:TRAINER
  sprite: mod/e2e.fixture/sprite/mob/Dummy
  display_name: Training Dummy
  level: 50
  hp: 40
  base_exp: 1000000
  job_exp: 1000000
  ai: 6
