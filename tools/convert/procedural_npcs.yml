# Core's NPCs of procedural worlds (decision 0044, proposal 0002 review
# decision 46), written for wAthena. Each stands at the named places of
# its tag in every town, so none appears in a classic world. The guild
# masters stand at the guild:<family> place that `wactl world new`
# gives one town per family, and the Valkyrie at the rebirth place of
# the largest town of the highest band.
- {name: "Kafra Employee#gen", place: {scope: "town:any", tag: storage}, direction: south, sprite: 4_F_KAFRA1, display_name: Kafra Employee, script: scripts/procedural/kafra.lua}
- {name: "Innkeeper#gen", place: {scope: "town:any", tag: inn}, direction: south, sprite: 1_M_INNKEEPER, display_name: Innkeeper, script: scripts/procedural/inn.lua}
- {name: "Refiner#gen", place: {scope: "town:any", tag: blacksmith}, direction: south, sprite: 4_M_DWARF, display_name: Refiner, script: scripts/procedural/refiner.lua}
