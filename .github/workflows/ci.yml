name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The store's integration tests run against PostgreSQL 18, the minimum
    # version (strategy section 3.5). They are skipped when
    # WATHENA_TEST_DATABASE_URL is unset.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      WATHENA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go vet ./...
      # Every test but e2e runs without the race detector. With it, every
      # package runs, and the heavy tests on one goroutine skip
      # (docs/decisions/0022-test-speed.md).
      - run: go test $(go list ./... | grep -v '/e2e$')
      - run: go test -race ./...

  # The mod tools (mods/README.md, "Tools"): validate and test the
  # sample mods and a new mod from the template, and check that the Lua
  # definitions and the API reference in docs/generated are current.
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go build -o "$RUNNER_TEMP/wactl" ./tools/wactl
      - name: Check the generated Lua definitions and API reference
        run: go test -count=1 -run TestGeneratedFiles ./server/modscript/luaapi
      - name: Validate and test the sample mods
        run: |
          for m in mods/examples/*/; do
            "$RUNNER_TEMP/wactl" mod validate "$m" --mods mods/examples
            "$RUNNER_TEMP/wactl" mod test "$m" --mods mods/examples
          done
      - name: Validate, test and pack a new mod
        run: |
          cd "$RUNNER_TEMP"
          ./wactl mod new example.ci
          ./wactl mod validate example.ci
          ./wactl mod test example.ci
          ./wactl mod pack example.ci --out dist
          mkdir installed
          ./wactl mod install dist/example.ci-0.1.0.zip --mods-dir installed

  # The Lua runtime in internal/script (decision 0002). The test job above
  # runs its cgo build with -race. This job checks the rest:
  #   - the vendored Lua sources against the pinned release tarball,
  #   - lua.wasm against a fresh build from the same C sources,
  #   - the same tests on the WebAssembly build, which builds without cgo,
  #   - the tests as a static musl binary, the way the image builds,
  #   - waserver for the release targets, cross-compiled with zig cc.
  lua:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.16.0
      ZIG_SHA256_LINUX_X86_64: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install zig and wasi-sdk
        run: |
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256_LINUX_X86_64}  zig.tar.xz" | sha256sum -c
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          curl -fsSLo wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "${WASI_SDK_SHA256}  wasi-sdk.tar.gz" | sha256sum -c
          tar -xzf wasi-sdk.tar.gz -C "$RUNNER_TEMP"
          echo "WASI_SDK=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
          rm zig.tar.xz wasi-sdk.tar.gz
      - name: Check the vendored Lua sources
        run: internal/script/lua/update.sh --check
      - name: Check lua.wasm
        run: |
          internal/script/wasm/build.sh
          git diff --exit-code -- internal/script/wasm/lua.wasm
      - name: Test the WebAssembly build
        run: |
          CGO_ENABLED=0 go test -count=1 ./internal/script/...
          go test -count=1 -tags luawasm ./internal/script/...
      - name: Test as a static musl binary
        env:
          CGO_ENABLED: "1"
          CC: zig cc -target x86_64-linux-musl
        run: |
          go test -c -o "$RUNNER_TEMP/script.test" -tags netgo,osusergo \
            -ldflags "-linkmode external -extldflags '-static -Wl,-z,stack-size=8388608'" ./internal/script
          cd internal/script && "$RUNNER_TEMP/script.test" -test.count=1
      - name: Build waserver for the release targets
        run: |
          static="-linkmode external -extldflags '-static -s -Wl,-z,stack-size=8388608'"
          build() {
            echo "== $1/$2"
            CGO_ENABLED=1 GOOS=$1 GOARCH=$2 CC="zig cc -target $3" go build -trimpath -tags netgo,osusergo \
              -ldflags "-s -w $4" -o "$RUNNER_TEMP/waserver-$1-$2" ./server/cmd/waserver
          }
          build linux amd64 x86_64-linux-musl "$static"
          build linux arm64 aarch64-linux-musl "$static"
          build windows amd64 x86_64-windows-gnu ""
          file "$RUNNER_TEMP"/waserver-*
          "$RUNNER_TEMP/waserver-linux-amd64" version

  # zig cc links macOS binaries against the SDK, which only a macOS machine
  # has, so darwin/arm64 builds on a macOS runner. The tests run natively.
  lua-macos:
    runs-on: macos-latest
    env:
      ZIG_VERSION: 0.16.0
      ZIG_SHA256_MACOS_AARCH64: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install zig
        run: |
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256_MACOS_AARCH64}  zig.tar.xz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - run: go test -race -count=1 ./internal/script/...
      - name: Build waserver for darwin/arm64
        run: |
          sdk=$(xcrun --show-sdk-path)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CC="zig cc -target aarch64-macos --sysroot $sdk -L/usr/lib -F$sdk/System/Library/Frameworks" \
            go build -trimpath -tags netgo,osusergo -ldflags "-s -w" -o "$RUNNER_TEMP/waserver-darwin-arm64" ./server/cmd/waserver
          "$RUNNER_TEMP/waserver-darwin-arm64" version

  # 50 bots against a server in its own process, on the placeholder map,
  # for 20 seconds (server/README.md, "Load tests and metrics"). It checks
  # that no bot fails and that the server stays within the budgets of
  # strategy section 3.8, with slack for shared runners.
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WATHENA_LOAD_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go test -count=1 -run TestLoadSmoke -v ./tools/botclient

  # Builds both images from the Dockerfile, and starts the Compose stack
  # of deploy/compose with the placeholder pack: world creation, health
  # checks, HTTPS through Caddy, and a backup and restore.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Compose file
        working-directory: deploy/compose
        run: docker compose --env-file .env.example --profile tools config --quiet
      - run: .github/scripts/compose-smoke.sh

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      # The TypeScript generator comes from the client's packages.
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - name: Lint the schema
        working-directory: schema
        run: go run github.com/bufbuild/buf/cmd/buf@v1.73.0 lint
      # Generated code is committed, so it must match the schema.
      - name: Check generated code
        working-directory: schema
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.73.0 generate
          git diff --exit-code -- gen ../client/src/gen

  # The query code sqlc generates is committed, so it must match the
  # migrations and queries. sqlc is pinned here, as buf is above.
  queries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check generated code
        working-directory: server/store
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- db
          test -z "$(git status --porcelain -- db)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude-generated ./...
      # Game code uses only sqlc's queries, never SQL built with fmt.Sprintf.
      - run: .github/scripts/sqlcheck.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: .github/scripts/fuzz.sh 10s

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  browsers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      # Renders the placeholder pack's map, decodes the encoder's test
      # sounds, and checks the Service Worker cache in Chromium.
      - run: pnpm check:browsers
        env:
          SCREENSHOTS: ${{ runner.temp }}/screenshots
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  tinygo:
    runs-on: ubuntu-latest
    env:
      TINYGO_VERSION: 0.42.0
      TINYGO_SHA256: 2082c4762fea6d5cc4cd1f4a243eaacf07b12f576717d4c6b74828bd163cb563
      WASMTIME_VERSION: 49.0.1
      WASMTIME_SHA256: c71f7e0d30a92e418f0d17db7c6d8f6664c1ad764340a1278678f4209deab534
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Install TinyGo and wasmtime
        run: |
          curl -fsSLo tinygo.deb "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          echo "${TINYGO_SHA256}  tinygo.deb" | sha256sum -c
          sudo dpkg -i tinygo.deb
          curl -fsSLo wasmtime.tar.xz "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          echo "${WASMTIME_SHA256}  wasmtime.tar.xz" | sha256sum -c
          tar -xJf wasmtime.tar.xz
          echo "$PWD/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      # The shared packages run in the web client, so they must pass the
      # same tests under TinyGo, both natively and as WebAssembly.
      - run: tinygo test ./shared/...
      - run: tinygo test -target=wasip1 ./shared/...
      # The client's pathfinding module is committed, so it must match its
      # source.
      - name: Check the client's path.wasm
        run: |
          tinygo build -o client/src/world/path.wasm -target=wasm-unknown -opt=2 -no-debug ./shared/path/wasm
          git diff --exit-code -- client/src/world/path.wasm
