# The phase 3 exit check (strategy section 15): a mod that adds an NPC,
# an item, a monster, a hook and a scheduled boss event without changes
# to the server. mods/README.md explains each part.
id: example.halloween
name: Halloween
version: 0.1.0
api: experimental
description: Pumpkin Porings on the Prontera fields, a witch with a hat, a night that doubles their drops, and the Pumpkin King every evening.
authors:
  - name: wAthena contributors
license: GPL-3.0-or-later
depends:
  - id: core
    version: ">=0.1"
supports:
  rulesets:
    base: [renewal, pre_renewal]
permissions:
  - player.give_items
  - world.announce
  - events.schedule
  - rules.override
scripts:
  - scripts/main.lua
