# New monsters. Each shows the sprite of a core monster, and starts from
# its stats. The server gives each an ID in the mod range (from 100,000)
# the first time it loads.
- name: example.halloween:PUMPKIN_PORING
  sprite: PORING
  display_name: Pumpkin Poring
  level: 12
  hp: 260
  attack: [18, 26]
  defense: 4
  base_exp: 90
  job_exp: 70
  element: ghost
  element_level: 1
  drops:
    - {item: Pumpkin, rate: 2000}
    - {item: Candy, rate: 1000}
    - {item: "example.halloween:Pumpkin_Hat", rate: 50}

