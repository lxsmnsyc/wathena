# New monsters. Each shows the sprite of a core monster, and starts from
# its stats. The server gives each an ID in the mod range (from 100,000)
# the first time it loads.
- name: example.halloween:PUMPKIN_PORING
  sprite: PORING
  display_name: Pumpkin Poring
  level: 12
  hp: 260
  attack: 22
  str: 12
  defense: 4
  base_exp: 90
  job_exp: 70
  element: ghost
  element_level: 1
  drops:
    - {item: Pumpkin, rate: 2000}
    - {item: Candy, rate: 1000}
    - {item: "example.halloween:Pumpkin_Hat", rate: 50}

# The boss of the Pumpkin_King event.
- name: example.halloween:PUMPKIN_KING
  sprite: JAKK
  display_name: Pumpkin King
  level: 60
  hp: 40000
  attack: 375
  defense: 30
  magic_defense: 30
  # HIT and FLEE come from the stats, as rAthena's status_calc_mob
  # computes them: HIT is level + DEX + 150, and FLEE level + AGI + 100.
  dex: 90
  agi: 60
  class: boss
  # AI type 04: it attacks players on sight, and changes target to a
  # player that hits it in melee.
  ai: 4
  base_exp: 25000
  job_exp: 18000
  drops:
    - {item: "example.halloween:Pumpkin_Hat", rate: 5000}
    - {item: Pumpkin_Head, rate: 10000}

# The boss of the Headless_Rider event, a typed boss event: core places
# it, announces it and gives the reward.
- name: example.halloween:HEADLESS_RIDER
  sprite: DULLAHAN
  display_name: Headless Rider
  level: 50
  hp: 20000
  attack: 300
  defense: 25
  magic_defense: 20
  dex: 70
  agi: 40
  class: boss
  # AI type 04: it attacks players on sight.
  ai: 4
  base_exp: 9000
  job_exp: 7000
  drops:
    - {item: Pumpkin_Head, rate: 10000}

# The chest of the Candy_Hunt event. Its drops are the loot. It has one
# HP, so one hit opens it, and it never moves.
- name: example.halloween:CANDY_CHEST
  sprite: TREASURE_BOX1
  display_name: Candy Chest
  level: 1
  hp: 1
  class: event
  ai: 6
  drops:
    - {item: Candy, rate: 10000}
    - {item: Candy_Striper, rate: 5000}
