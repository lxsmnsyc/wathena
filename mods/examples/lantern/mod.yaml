# A sample mod with art of its own (decision 0033): a Paper Lantern with
# an icon and a dropped sprite, Lantern Ghosts with an animated sprite,
# and the Lamplighter, an NPC with a sprite, who sells lanterns. The
# art's sources are in art/. wactl mod build-art builds them into
# assets/, and wactl mod pack builds them into the .zip file.
# mods/README.md, "Art", explains each part.
id: example.lantern
name: Lantern Festival
version: 0.1.0
api: 1.0
description: Paper lanterns, lantern ghosts that drop them, and a lamplighter who sells them, all with art of the mod's own.
authors:
  - name: wAthena contributors
license: GPL-3.0-or-later
depends:
  - id: core
    version: ">=0.1"
supports:
  rulesets:
    base: [renewal, pre_renewal]
permissions:
  - game.read
scripts:
  - scripts/main.lua
