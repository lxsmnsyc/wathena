# The Paper Lantern needs no art field: its art is found by its name,
# mod/example.lantern/icon/item/Paper_Lantern for the icon and
# mod/example.lantern/sprite/item/Paper_Lantern for the dropped sprite.
- name: example.lantern:Paper_Lantern
  type: Etc
  display_name: Paper Lantern
  weight: 10
  buy: 50
  sell: 10
  stackable: true
  # The client shows the description under the name. Lines keep RO's
  # color codes: ^ and six hex digits set the color of the text after it.
  description: |-
    A lantern of thin paper that Lantern Ghosts carry.
    ^777777Weight:^000000 1
# Lantern Oil names the lantern's icon with the icon field.
- name: example.lantern:Lantern_Oil
  type: Etc
  display_name: Lantern Oil
  weight: 5
  buy: 20
  sell: 5
  stackable: true
  icon: mod/example.lantern/icon/item/Paper_Lantern
# The Unlit Lantern has no art, so the client shows the placeholder
# icon, and logs the missing name once.
- name: example.lantern:Unlit_Lantern
  type: Etc
  display_name: Unlit Lantern
  weight: 10
  buy: 10
  sell: 2
  stackable: true
# The Lantern Hat shows its own sprite on the head that wears it. The
# view_sprite field names it, and the icon is found by the hat's name.
- name: example.lantern:Lantern_Hat
  type: Armor
  display_name: Lantern Hat
  weight: 30
  buy: 200
  sell: 50
  location: [head_top]
  def: 1
  view_sprite: mod/example.lantern/sprite/headgear/Lantern_Hat
  description: |-
    A felt hat with a small lantern on top.
    ^777777Defense:^000000 1
# The Lantern Shield shows its own sprite on the arm that carries it, as
# the Lantern Hat does on the head (decision 0036). The icon is found by
# the shield's name.
- name: example.lantern:Lantern_Shield
  type: Armor
  display_name: Lantern Shield
  weight: 60
  buy: 400
  sell: 100
  location: [left_hand]
  def: 3
  slots: 1
  view_sprite: mod/example.lantern/sprite/shield/Lantern_Shield
  description: |-
    A light shield with a lantern painted on its face.
    ^777777Defense:^000000 3
