# The Lamplighter sells lanterns. Its sprite is the mod's art. The second
# placement is on the placeholder map, where a server with only the
# placeholder pack starts its players.
- name: Lamplighter#prontera
  map: prontera
  x: 152
  y: 191
  direction: south
  sprite: mod/example.lantern/sprite/npc/Lamplighter
  shop:
    - {item: "example.lantern:Paper_Lantern"}
    - {item: "example.lantern:Lantern_Oil"}
    - {item: "example.lantern:Unlit_Lantern"}
    - {item: "example.lantern:Lantern_Hat"}
    - {item: "example.lantern:Lantern_Shield"}
- name: Lamplighter#placeholder
  map: placeholder/map
  x: 14
  y: 14
  direction: south
  sprite: mod/example.lantern/sprite/npc/Lamplighter
  shop:
    - {item: "example.lantern:Paper_Lantern"}
    - {item: "example.lantern:Lantern_Oil"}
    - {item: "example.lantern:Unlit_Lantern"}
    - {item: "example.lantern:Lantern_Hat"}
    - {item: "example.lantern:Lantern_Shield"}
# The Lantern Master makes Merchants at job level 40 into Lantern Keepers.
# It shows core's Knight master sprite.
- name: Lantern_Master#prontera
  map: prontera
  x: 157
  y: 191
  direction: south
  sprite: 4_M_JOB_KNIGHT1
  display_name: Lantern Master
  script: scripts/npc/lantern_master.lua
- name: Lantern_Master#placeholder
  map: placeholder/map
  x: 16
  y: 12
  direction: south
  sprite: 4_M_JOB_KNIGHT1
  display_name: Lantern Master
  script: scripts/npc/lantern_master.lua
