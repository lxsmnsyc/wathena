# The Desperado: a new second job for Gunslingers. The server gives it an
# ID in the mod range (from 10,000) the first time it loads.
#
# A field that is left out comes from the look job, here the Gunslinger:
# its sprites, weight limit, base ASPD and the rest. The Desperado
# changes some of them.
- name: example.desperado:Desperado
  display_name: Desperado
  look: gunslinger
  # A second job: rAthena's rules that read the class treat it as the
  # second job of the Gunslinger's line.
  tier: second
  # A Gunslinger at job level 40 may become a Desperado.
  changes_from:
    - {job: gunslinger, job_level: 40}
  # Its skill tree starts with the Novice's and the Gunslinger's.
  inherits: [novice, gunslinger]
  max_job_level: 50
  # The Knight's exp tables, which have 50 job levels.
  exp_table: knight
  max_weight: 32000
  hp: {factor: 110, increase: 500}
  aspd: {revolver: 55, rifle: 70}
  bonus_stats:
    - {level: 1, dex: 1}
    - {level: 5, agi: 1}
    - {level: 10, dex: 1}
    - {level: 20, luk: 1}
    - {level: 30, dex: 1}
    - {level: 40, agi: 1}
    - {level: 50, dex: 1}
