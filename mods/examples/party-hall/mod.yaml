# A sample mod for parties (proposal 0002, review decision 27): it makes
# parties with wa.parties, greets members on the party events, and reads
# the ruleset's limits. mods/README.md, "Parties and friends", explains
# each part.
id: example.party-hall
name: Party Hall
version: 0.1.0
api: 1.0
description: Makes a party when a player says !party, greets members who join or leave, and tells the party when its options change.
authors:
  - name: wAthena contributors
license: GPL-3.0-or-later
depends:
  - id: core
    version: ">=0.1"
supports:
  rulesets:
    base: [renewal, pre_renewal]
permissions:
  - event.listen
  - game.read
  - party.manage
scripts:
  - scripts/main.lua
